  function fmtMonthShort(ym) {
    // ym like "2026-09"
    var parts = ym.split("-");
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
    var month = d.toLocaleDateString("en-US", { month: "short" });
    var yy = String(d.getFullYear()).slice(-2);
    return month + " '" + yy;
  }

  function buildGenericTable(rows, sortKey, sortDir, onSort, cols, emptyText) {
    var sorted = sortPrograms(rows, sortKey, sortDir);
    var wrap = document.createElement("div");

    if (sorted.length === 0) {
      var empty = document.createElement("p");
      empty.className = "empty-note";
      empty.textContent = emptyText || "No data available.";
      wrap.appendChild(empty);
      return wrap;
    }

    var scroll = document.createElement("div");
    scroll.className = "table-scroll";
    var table = document.createElement("table");
    table.className = "programs";

    var thead = document.createElement("thead");
    var htr = document.createElement("tr");
    cols.forEach(function (col) {
      var th = document.createElement("th");
      if (col.align === "right") th.classList.add("num-col");
      if (col.sticky) th.classList.add("sticky-col");
      if (col.sortable === false) {
        th.textContent = col.label;
        htr.appendChild(th);
        return;
      }
      var btn = document.createElement("button");
      btn.type = "button";
      btn.appendChild(document.createTextNode(col.label + " "));
      var arrow = document.createElement("span");
      arrow.className = "sort-arrow" + (sortKey === col.key ? " active" : "");
      arrow.textContent = sortKey === col.key ? (sortDir === "asc" ? "▲" : "▼") : "▲▼";
      btn.appendChild(arrow);
      btn.addEventListener("click", function () { onSort(col.key); });
      th.appendChild(btn);
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    sorted.forEach(function (row) {
      var tr = document.createElement("tr");
      cols.forEach(function (col) {
        var td = document.createElement("td");
        if (col.align === "right") td.classList.add("num-cell");
        if (col.sticky) td.classList.add("sticky-col");
        if (col.render) {
          col.render(td, row);
        } else {
          td.textContent = row[col.key];
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    wrap.appendChild(scroll);
    return wrap;
  }

  // ---------- Center filter dropdown ----------
  // Centers excluded from the DEFAULT selection (still shown in the dropdown, just unchecked
  // until the viewer opts in) on every tab that has a center filter. Applies only on tabs whose
  // center list actually contains the name below — tabs without it behave exactly as before
  // (default = every center, "All centers" label).
  var DEFAULT_EXCLUDED_CENTERS = ["Out of North America"];

  // Resolves a tab's raw center-filter state into what should actually be used for filtering.
  // rawState is state.<tab>Centers as stored: null means "viewer hasn't touched this filter yet",
  // a Set means an explicit selection the viewer made (via Apply) — including, deliberately, a
  // Set equal to every center: that's kept distinct from null so re-checking everything (e.g. Out
  // of North America) sticks instead of silently reverting to the default on the next render.
  function resolveCenterSelection(rawState, allCenterNames) {
    if (rawState !== null) {
      return { selected: rawState, isFiltered: rawState.size !== allCenterNames.length };
    }
    var defaults = allCenterNames.filter(function (c) { return DEFAULT_EXCLUDED_CENTERS.indexOf(c) === -1; });
    if (defaults.length === allCenterNames.length) {
      // None of the default-excluded centers exist in this tab's data — nothing to exclude.
      return { selected: null, isFiltered: false };
    }
    return { selected: new Set(defaults), isFiltered: true };
  }

  function buildCenterDropdown(allCenters, selected, onApply, opts) {
    // allCenters: sorted array of center name strings
    // selected: Set of selected names, or null meaning "all centers"
    // opts: optional { allLabel, searchPlaceholder, emptyText, pluralNoun } to reuse this same
    // dropdown for non-"center" entities (e.g. countries on the App tab) with matching wording.
    opts = opts || {};
    var allLabel = opts.allLabel || "All centers";
    var searchPlaceholder = opts.searchPlaceholder || "Search centers…";
    var emptyText = opts.emptyText || "No centers match.";
    var pluralNoun = opts.pluralNoun || "centers";

    var wrap = document.createElement("div");
    wrap.className = "center-filter";

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "center-filter-btn";
    var btnLabel = document.createElement("span");
    var chev = document.createElement("span");
    chev.className = "chev";
    chev.textContent = "▾";
    btn.appendChild(btnLabel);
    btn.appendChild(chev);

    function updateBtnLabel() {
      if (!selected || selected.size === 0 || selected.size === allCenters.length) {
        btnLabel.textContent = allLabel;
      } else if (selected.size === 1) {
        var only;
        selected.forEach(function (c) { only = c; });
        btnLabel.textContent = only;
      } else {
        var excludedHere = DEFAULT_EXCLUDED_CENTERS.filter(function (c) { return allCenters.indexOf(c) !== -1; });
        var missing = allCenters.filter(function (c) { return !selected.has(c); });
        var isDefaultMinusExcluded = excludedHere.length > 0 && missing.length === excludedHere.length &&
          missing.every(function (c) { return excludedHere.indexOf(c) !== -1; });
        btnLabel.textContent = isDefaultMinusExcluded ? ("All except " + missing.join(", ")) : (selected.size + " " + pluralNoun + " selected");
      }
    }
    updateBtnLabel();
    wrap.appendChild(btn);

    var panel = document.createElement("div");
    panel.className = "center-filter-panel";
    panel.hidden = true;

    var searchInput = document.createElement("input");
    searchInput.type = "text";
    searchInput.placeholder = searchPlaceholder;
    searchInput.className = "center-filter-search";
    panel.appendChild(searchInput);

    var actionsRow = document.createElement("div");
    actionsRow.className = "center-filter-actions";
    var selectAllBtn = document.createElement("button");
    selectAllBtn.type = "button";
    selectAllBtn.textContent = "Select all";
    var clearBtn = document.createElement("button");
    clearBtn.type = "button";
    clearBtn.textContent = "Clear";
    actionsRow.appendChild(selectAllBtn);
    actionsRow.appendChild(clearBtn);
    panel.appendChild(actionsRow);

    var listWrap = document.createElement("div");
    listWrap.className = "center-filter-list";
    panel.appendChild(listWrap);

    var workingSet = selected ? new Set(selected) : new Set(allCenters);

    // Default-excluded centers (e.g. "Out of North America") are pinned to the top of the
    // checklist, ahead of the rest of the alphabetical list, so they're easy to find/re-check
    // regardless of where they'd otherwise sort.
    var pinnedFirst = DEFAULT_EXCLUDED_CENTERS.filter(function (c) { return allCenters.indexOf(c) !== -1; });
    var orderedCenters = pinnedFirst.concat(allCenters.filter(function (c) { return pinnedFirst.indexOf(c) === -1; }));

    function renderList(filterText) {
      listWrap.innerHTML = "";
      var ft = (filterText || "").toLowerCase();
      var shown = 0;
      var pinnedShown = 0;
      var dividerAdded = false;
      orderedCenters.forEach(function (c) {
        if (ft && c.toLowerCase().indexOf(ft) === -1) return;
        var isPinned = pinnedFirst.indexOf(c) !== -1;
        if (isPinned) pinnedShown++;
        if (!isPinned && pinnedShown > 0 && !dividerAdded) {
          var divider = document.createElement("div");
          divider.className = "center-filter-divider";
          listWrap.appendChild(divider);
          dividerAdded = true;
        }
        shown++;
        var label = document.createElement("label");
        label.className = "center-filter-item";
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = workingSet.has(c);
        cb.addEventListener("change", function () {
          if (cb.checked) workingSet.add(c); else workingSet.delete(c);
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(" " + c));
        listWrap.appendChild(label);
      });
      if (shown === 0) {
        var empty = document.createElement("p");
        empty.className = "center-filter-empty";
        empty.textContent = emptyText;
        listWrap.appendChild(empty);
      }
    }
    renderList("");

    searchInput.addEventListener("input", function () { renderList(searchInput.value); });
    selectAllBtn.addEventListener("click", function () {
      allCenters.forEach(function (c) { workingSet.add(c); });
      renderList(searchInput.value);
    });
    clearBtn.addEventListener("click", function () {
      workingSet.clear();
      renderList(searchInput.value);
    });

    var applyBtn = document.createElement("button");
    applyBtn.type = "button";
    applyBtn.className = "center-filter-apply";
    applyBtn.textContent = "Apply";
    applyBtn.addEventListener("click", function () {
      panel.hidden = true;
      // Clearing everything resets to the tab's default selection (null). Selecting literally
      // every center is kept as an explicit Set rather than also collapsing to null — otherwise a
      // center that's unchecked by default (see DEFAULT_EXCLUDED_CENTERS) would silently drop back
      // out the next time this renders, even after the viewer deliberately re-checked it.
      var newSelected = workingSet.size === 0 ? null : new Set(workingSet);
      onApply(newSelected);
    });
    panel.appendChild(applyBtn);

    wrap.appendChild(panel);

    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      panel.hidden = !panel.hidden;
      if (!panel.hidden) searchInput.focus();
    });
    document.addEventListener("click", function (e) {
      if (!wrap.contains(e.target)) panel.hidden = true;
    });

    return wrap;
  }

  function buildFilterBar(allCenters, selected, onApply, opts) {
    // opts: optional { barLabel, allLabel, searchPlaceholder, emptyText, pluralNoun } — see
    // buildCenterDropdown. Defaults reproduce the original "Centers" wording unchanged.
    opts = opts || {};
    var bar = document.createElement("div");
    bar.className = "filter-bar";
    var label = document.createElement("span");
    label.className = "filter-label";
    label.textContent = opts.barLabel || "Centers";
    bar.appendChild(label);
    bar.appendChild(buildCenterDropdown(allCenters, selected, onApply, opts));
    return bar;
  }

  // ---------- Per-center data filtering ----------
  function sumMonthlyByCenter(records, months, valueField, selectedCenters) {
    var out = {};
    months.forEach(function (m) { out[m] = 0; });
    records.forEach(function (r) {
      if (selectedCenters && !selectedCenters.has(r.c)) return;
      if (out.hasOwnProperty(r.m)) out[r.m] += r[valueField];
    });
    return months.map(function (m) { return out[m]; });
  }

  function sumWeeklyByCenter(records, weekStarts, valueField, selectedCenters) {
    var out = {};
    weekStarts.forEach(function (w) { out[w] = 0; });
    records.forEach(function (r) {
      if (selectedCenters && !selectedCenters.has(r.c)) return;
      if (out.hasOwnProperty(r.w)) out[r.w] += r[valueField];
    });
    return weekStarts.map(function (w) { return out[w]; });
  }

  function sumYearlyByCenter(records, years, valueField, selectedCenters) {
    var out = {};
    years.forEach(function (y) { out[y] = 0; });
    records.forEach(function (r) {
      if (selectedCenters && !selectedCenters.has(r.c)) return;
      var y = r.m.slice(0, 4);
      if (out.hasOwnProperty(y)) out[y] += r[valueField];
    });
    return years.map(function (y) { return out[y]; });
  }

  // ---------- Date-window aggregation (Visits) ----------
  // Ashram visitors now tracks only Adults/Children per row (no Count/Unique.Accounts — see the
  // "Ashram visitors" tab rebuild note near renderVisitTab), so this sums adults/children overall
  // plus per-visit-type adults/children (needed for the Compare Windows by-type table).
  function sumDailyRange(daily, startISO, endISO) {
    var out = { days: 0, adults: 0, children: 0,
      program_adults: 0, program_children: 0, overnight_adults: 0, overnight_children: 0,
      day_adults: 0, day_children: 0, volunteer_adults: 0, volunteer_children: 0 };
    if (!startISO || !endISO || startISO > endISO) return out;
    var msPerDay = 24 * 60 * 60 * 1000;
    out.days = Math.round((new Date(endISO + "T00:00:00") - new Date(startISO + "T00:00:00")) / msPerDay) + 1;
    for (var i = 0; i < daily.length; i++) {
      var r = daily[i];
      if (r.date < startISO) continue;
      if (r.date > endISO) continue;
      out.adults += r.adults;
      out.children += r.children;
      out.program_adults += r.program_adults; out.program_children += r.program_children;
      out.overnight_adults += r.overnight_adults; out.overnight_children += r.overnight_children;
      out.day_adults += r.day_adults; out.day_children += r.day_children;
      out.volunteer_adults += r.volunteer_adults; out.volunteer_children += r.volunteer_children;
    }
    return out;
  }

  // Sums EXTRA.visit.daily_by_satsang (array of [date, satsangCenter, adults, children], sorted
  // by date) over an arbitrary date range into one row per satsang center — the "Visitors by
  // sathsang center" tool's equivalent of sumDailyRange() above, just grouped by an extra
  // dimension instead of collapsed to one total. Returns every center that had ANY people in the
  // range, sorted by total (adults+children) desc; the caller re-sorts via buildGenericTable.
  function sumSatsangRange(records, startISO, endISO) {
    var byCenter = {};
    if (!startISO || !endISO || startISO > endISO) return [];
    for (var i = 0; i < records.length; i++) {
      var rec = records[i];
      var d = rec[0];
      if (d < startISO || d > endISO) continue;
      var c = rec[1];
      var row = byCenter[c];
      if (!row) { row = { center: c, adults: 0, children: 0 }; byCenter[c] = row; }
      row.adults += rec[2];
      row.children += rec[3];
    }
    var out = Object.keys(byCenter).map(function (k) {
      var r = byCenter[k];
      r.total = r.adults + r.children;
      return r;
    });
    out.sort(function (a, b) { return b.total - a.total; });
    return out;
  }

  // Sums each filtered program's own per-week `weekly_aligned` array (index-aligned to the
  // group's full week-bucket list, same convention already used for each program's own
  // sparkline) into a group-shaped {start,end,count}[] series — lets a center filter recompute
  // the group weekly chart/table entirely client-side, no pipeline change needed, since every
  // program already carries its own weekly counts.
  function sumProgramWeekly(programs, groupWeekly) {
    var sums = groupWeekly.map(function () { return 0; });
    programs.forEach(function (p) {
      var wa = p.weekly_aligned;
      if (!wa) return;
      for (var i = 0; i < sums.length; i++) {
        var v = wa[i];
        if (v) sums[i] += v;
      }
    });
    return groupWeekly.map(function (wk, i) { return { start: wk.start, end: wk.end, count: sums[i] }; });
  }

  // ---------- Program tabs: read the warehouse `dash_programs` export directly ----------
  // REPORTS.programs is the export as published:
  //   programs[] — one row per program: programSfId, programName, groupKey (which tab),
  //                centerName, status, createdDate, startDate, daysUntilStart, isEvergreen,
  //                asOfDay, registrations, registrationsPrior, firstRegistrationDate
  //   weekly[]   — program × Saturday–Friday week: programSfId, weekStart, weekEnd, registrations
  // The tab computes its own figures from those rows (see dash_programs.yml for the rules):
  //   * evergreen programs are listed but kept out of totals, weeks and counts, except on
  //     tabs with includeEvergreen (Ishanga);
  //   * a tab's weeks start at the earliest creation week of its counted programs and end
  //     with the week containing the snapshot day;
  //   * status (Paid / Free / Training) is shown on iiis and IYCLA only;
  //   * "New" = first registration within the last 28 days (the hand export compared with
  //     the previous build, which the warehouse cannot do).
  var PROGRAM_STATUS_TABS = { iiis: true, iycla: true };
  var PROGRAM_NEW_DAYS = 28;

  function utcDay(s) { return new Date(s + "T00:00:00Z"); }
  function isoDay(x) { return x.toISOString().slice(0, 10); }
  function addUtcDays(s, n) { var x = utcDay(s); x.setUTCDate(x.getUTCDate() + n); return isoDay(x); }
  function saturdayWeek(s) { var x = utcDay(s); x.setUTCDate(x.getUTCDate() - ((x.getUTCDay() + 1) % 7)); return isoDay(x); }
  function repairText(s) {                    // UTF-8 read as Latin-1 upstream ('MÃ©xico')
    if (!s || !/[ÃÂ]/.test(s)) return s;
    try { return decodeURIComponent(escape(s)); } catch (e) { return s; }
  }

  function programsTabCount(tabDef) {
    var r = REPORTS.programs;
    if (!r) return "…";
    return r.programs.filter(function (p) {
      return p.groupKey === tabDef.key && (tabDef.includeEvergreen || !p.isEvergreen);
    }).length;
  }

  function programsView(report, tabKey, includeEvergreen) {
    var rows = report.programs.filter(function (r) { return r.groupKey === tabKey; });
    var today = report.programs.length ? report.programs[0].asOfDay
              : addUtcDays(report.provenance.generatedAt.slice(0, 10), -1);
    var thisWeek = saturdayWeek(today);
    var byProgramWeek = {};
    report.weekly.forEach(function (w) {
      (byProgramWeek[w.programSfId] = byProgramWeek[w.programSfId] || {})[w.weekStart] = w.registrations;
    });
    function weeksFrom(first) {
      var out = [];
      for (var wk = first; wk <= thisWeek; wk = addUtcDays(wk, 7)) out.push({ start: wk, end: addUtcDays(wk, 6) });
      return out;
    }
    var counted = rows.filter(function (r) { return includeEvergreen || !r.isEvergreen; });
    var firstWeek = counted.reduce(function (m, r) { var w = saturdayWeek(r.createdDate); return !m || w < m ? w : m; }, null);
    var tabWeeks = firstWeek ? weeksFrom(firstWeek) : [];

    var programs = rows.map(function (r) {
      var byWeek = byProgramWeek[r.programSfId] || {};
      var created = saturdayWeek(r.createdDate);
      var weekly = null, aligned = null;
      if (!r.isEvergreen) {
        weekly = weeksFrom(created).map(function (w) { return { start: w.start, end: w.end, count: byWeek[w.start] || 0 }; });
        aligned = tabWeeks.map(function (w) { return w.start < created ? null : (byWeek[w.start] || 0); });
      }
      return {
        center: r.centerName,
        name: repairText(r.programName),
        created: r.createdDate,
        start: r.startDate,
        total_regs: r.registrations,
        days_until_start: r.daysUntilStart,
        is_evergreen: r.isEvergreen,
        regs_yesterday: r.registrationsPrior,
        regs_delta: r.registrations - r.registrationsPrior,
        is_new: (utcDay(today) - utcDay(r.firstRegistrationDate)) / 864e5 < PROGRAM_NEW_DAYS,
        weekly: weekly,
        weekly_aligned: aligned,
        status: PROGRAM_STATUS_TABS[tabKey] ? r.status : null
      };
    });
    var countedPrograms = programs.filter(function (p) { return includeEvergreen || !p.is_evergreen; });
    var weekly = tabWeeks.map(function (w) {
      var c = 0;
      counted.forEach(function (r) { c += (byProgramWeek[r.programSfId] || {})[w.start] || 0; });
      return { start: w.start, end: w.end, count: c };
    });
    var statusBreakdown = null;
    if (PROGRAM_STATUS_TABS[tabKey]) {
      var byStatus = {};
      countedPrograms.forEach(function (p) { byStatus[p.status] = (byStatus[p.status] || 0) + p.total_regs; });
      statusBreakdown = Object.keys(byStatus).map(function (k) { return { status: k, total_regs: byStatus[k] }; })
        .sort(function (a, b) { return b.total_regs - a.total_regs; });
    }
    return {
      today: today,
      programs: programs,
      weekly: weekly,
      n_programs_excluded: programs.length - countedPrograms.length,
      status_breakdown: statusBreakdown,
      unclassified: report.programs.filter(function (r) { return r.groupKey === "(unclassified)"; }).length
    };
  }

  // ---------- App Data tab ----------
  // Sums a by-country row (has one numeric field per country name, e.g. {US:.., Canada:.., LATAM:..})
  // down to a single total, honoring a country-filter selection (null = every country).
  function sumAppCountries(row, countries, selected) {
    if (!selected) return countries.reduce(function (t, c) { return t + (row[c] || 0); }, 0);
    var t = 0;
    countries.forEach(function (c) { if (selected.has(c)) t += (row[c] || 0); });
    return t;
  }

  // Recomputes an App metric's weekly/this-week/prev-week/peak-day figures under a country
  // filter, from its raw per-country daily+weekly series (client-side — no pipeline change
  // needed to support arbitrary US/Canada/LATAM combinations).
  function filterAppMetric(metric, countries, selected) {
    var weekly = metric.weekly.map(function (w) {
      return { start: w.start, end: w.end, count: sumAppCountries(w, countries, selected) };
    });
    var thisWeek = weekly[weekly.length - 1];
    var prevWeek = weekly.length > 1 ? weekly[weekly.length - 2] : { count: 0 };
    var peak = null;
    metric.daily.forEach(function (d) {
      var v = sumAppCountries(d, countries, selected);
      if (!peak || v > peak.v) peak = { date: d.date, v: v };
    });
    return {
      weekly: weekly,
      thisWeek: thisWeek.count,
      prevWeek: prevWeek.count,
      delta: thisWeek.count - prevWeek.count,
      peak: peak,
      minDate: metric.min_date,
      maxDate: metric.max_date
    };
  }

  // Finds the single day that maximizes metricA + metricB together (e.g. "biggest combined
  // download day"), matched by date key rather than assumed index alignment. This is distinct
  // from metricA.peak/metricB.peak (each metric's OWN independent best day, which can fall on
  // different dates) — mixing those two would mislabel one metric's value as having happened on
  // the other's peak date. Only meaningful for two metrics sharing the same unit (e.g. downloads
  // + downloads); not used for Minutes Meditated + Completions, which have different units and
  // are reported as their own independent peak days instead.
  function combinedDailyPeak(dailyA, dailyB, countries, selected) {
    var mapB = {};
    dailyB.forEach(function (d) { mapB[d.date] = sumAppCountries(d, countries, selected); });
    var best = null;
    dailyA.forEach(function (d) {
      var va = sumAppCountries(d, countries, selected);
      var vb = mapB.hasOwnProperty(d.date) ? mapB[d.date] : 0;
      var total = va + vb;
      if (!best || total > best.total) best = { date: d.date, a: va, b: vb, total: total };
    });
    return best;
  }

    var hasEngagement = !!(a.metrics.minutes_meditated && a.metrics.completions_7min);
    var countries = a.countries; // ["US", "Canada", "LATAM"]

      var dlPeak = combinedDailyPeak(a.metrics.mom_downloads.daily, a.metrics.sadhguru_downloads.daily, countries, selected);

    tableCard.appendChild(buildGenericTable(rows, state.sortKey, state.sortDir, function (key) {
      state.sortDir = (state.sortKey === key) ? (state.sortDir === "asc" ? "desc" : "asc") : "desc";
      state.sortKey = key;
      render();
    }, cols));
    content.appendChild(tableCard);

    // ---- Downloads by OS, monthly (new this update) ----
    // All-time OS totals (sum across every month in the file, respecting the country filter) —
    // not present as its own stat in the source CSVs (only a per-file "Total" row, which this
    // reproduces exactly), so it's computed here rather than shipped from the pipeline.
    function sumOsAllTime(osMonths) {
      var android = 0, ios = 0;
      osMonths.forEach(function (m) {
        countries.forEach(function (c) {
          if (selected && !selected.has(c)) return;
          android += m[c].android;
          ios += m[c].ios;
        });
      });
      var total = android + ios;
      return {
        android: android, ios: ios,
        androidPct: total ? Math.round(1000 * android / total) / 10 : 0,
        iosPct: total ? Math.round(1000 * ios / total) / 10 : 0
      };
    }

    function buildOsTable(osMonths, sortKey, sortDir, onSort) {
      // OS rows nest {android, ios} per country (not a flat numeric field), so sum those two
      // sub-fields directly per selected country rather than reusing sumAppCountries as-is.
      var rows = osMonths.map(function (m) {
        var android = 0, ios = 0;
        countries.forEach(function (c) {
          if (selected && !selected.has(c)) return;
          android += m[c].android;
          ios += m[c].ios;
        });
        var total = android + ios;
        return {
          month: m.month,
          android: android,
          ios: ios,
          android_pct: total ? Math.round(1000 * android / total) / 10 : 0,
          ios_pct: total ? Math.round(1000 * ios / total) / 10 : 0
        };
      });
      var osCols = [
        { key: "month", label: "Month", align: "left", sticky: true, render: function (td, row) { td.textContent = fmtMonthShort(row.month); } },
        { key: "android", label: "Android", align: "right" },
        { key: "ios", label: "iOS", align: "right" },
        { key: "android_pct", label: "Android %", align: "right", render: function (td, row) { td.textContent = row.android_pct.toFixed(1) + "%"; } },
        { key: "ios_pct", label: "iOS %", align: "right", render: function (td, row) { td.textContent = row.ios_pct.toFixed(1) + "%"; } }
      ];
      return buildGenericTable(rows, sortKey, sortDir, onSort, osCols);
    }

    if (!a.os_split) {
      var osNote = document.createElement("div");

      content.appendChild(osNote);
      return;
    }
    var osCard = document.createElement("div");
    osCard.className = "card";
    osCard.appendChild(buildCardHead("Downloads by OS" + filterSuffix, "Monthly Android / iOS split · sort any column"));

    if (showMom && showSadhguru) {
      var osGrid = document.createElement("div");
      osGrid.className = "chart-grid-2";

      var momOsAllTime = sumOsAllTime(a.os_split.mom);
      var osMomSub = document.createElement("div");
      osMomSub.className = "chart-sub-card";
      osMomSub.appendChild(buildCardHead("MOM App", a.os_split.mom.length + " months · all-time " + fmtInt(momOsAllTime.android) + " Android (" + momOsAllTime.androidPct.toFixed(1) + "%) · " + fmtInt(momOsAllTime.ios) + " iOS (" + momOsAllTime.iosPct.toFixed(1) + "%)"));
      osMomSub.appendChild(buildOsTable(a.os_split.mom, state.sortKey2, state.sortDir2, function (key) {
        state.sortDir2 = (state.sortKey2 === key) ? (state.sortDir2 === "asc" ? "desc" : "asc") : "desc";
        state.sortKey2 = key;
        render();
      }));
      osGrid.appendChild(osMomSub);

      var sgOsAllTime = sumOsAllTime(a.os_split.sadhguru);
      var osSgSub = document.createElement("div");
      osSgSub.className = "chart-sub-card";
      osSgSub.appendChild(buildCardHead("Sadhguru App", a.os_split.sadhguru.length + " months · all-time " + fmtInt(sgOsAllTime.android) + " Android (" + sgOsAllTime.androidPct.toFixed(1) + "%) · " + fmtInt(sgOsAllTime.ios) + " iOS (" + sgOsAllTime.iosPct.toFixed(1) + "%)"));
      osSgSub.appendChild(buildOsTable(a.os_split.sadhguru, state.sortKey3, state.sortDir3, function (key) {
        state.sortDir3 = (state.sortKey3 === key) ? (state.sortDir3 === "asc" ? "desc" : "asc") : "desc";
        state.sortKey3 = key;
        render();
      }));
      osGrid.appendChild(osSgSub);

      osCard.appendChild(osGrid);
    } else if (showMom) {
      var momOsAllTimeSolo = sumOsAllTime(a.os_split.mom);
      osCard.appendChild(buildCardHead("MOM App", a.os_split.mom.length + " months · all-time " + fmtInt(momOsAllTimeSolo.android) + " Android (" + momOsAllTimeSolo.androidPct.toFixed(1) + "%) · " + fmtInt(momOsAllTimeSolo.ios) + " iOS (" + momOsAllTimeSolo.iosPct.toFixed(1) + "%)"));
      osCard.appendChild(buildOsTable(a.os_split.mom, state.sortKey2, state.sortDir2, function (key) {
        state.sortDir2 = (state.sortKey2 === key) ? (state.sortDir2 === "asc" ? "desc" : "asc") : "desc";
        state.sortKey2 = key;
        render();
      }));
    } else if (showSadhguru) {
      var sgOsAllTimeSolo = sumOsAllTime(a.os_split.sadhguru);
      osCard.appendChild(buildCardHead("Sadhguru App", a.os_split.sadhguru.length + " months · all-time " + fmtInt(sgOsAllTimeSolo.android) + " Android (" + sgOsAllTimeSolo.androidPct.toFixed(1) + "%) · " + fmtInt(sgOsAllTimeSolo.ios) + " iOS (" + sgOsAllTimeSolo.iosPct.toFixed(1) + "%)"));
      osCard.appendChild(buildOsTable(a.os_split.sadhguru, state.sortKey3, state.sortDir3, function (key) {
        state.sortDir3 = (state.sortKey3 === key) ? (state.sortDir3 === "asc" ? "desc" : "asc") : "desc";
        state.sortKey3 = key;
        render();
      }));
    }
    content.appendChild(osCard);
  }

  // ---------- IEO Insights tab ----------
  var STEP_LABELS = ["1", "2", "3", "4", "5", "6", "7"];

  function sumFunnelByCenter(records, steps, selectedCenters) {
    var outExpired = {}, outActive = {};
    steps.forEach(function (s) { outExpired[s] = 0; outActive[s] = 0; });
    records.forEach(function (r) {
      if (selectedCenters && !selectedCenters.has(r.c)) return;
      if (outExpired.hasOwnProperty(r.s)) { outExpired[r.s] += r.expired; outActive[r.s] += r.in_progress; }
    });
    return { expired: steps.map(function (s) { return outExpired[s]; }), active: steps.map(function (s) { return outActive[s]; }) };
  }

  function sumLangByCenter(records, langs, selectedCenters) {
    var out = {};
    langs.forEach(function (l) { out[l] = 0; });
    records.forEach(function (r) {
      if (selectedCenters && !selectedCenters.has(r.c)) return;
      if (out.hasOwnProperty(r.lang)) out[r.lang] += r.n;
    });
    return langs.map(function (l) { return out[l]; });
  }

  function renderIeoTab(content, tabDef) {
    // IEO reads the warehouse `ieo_dashboard` report through ieoView().
    if (!REPORTS.ieo) { content.appendChild(reportStatusCard("ieo", "IEO data")); return; }
    var o = reportView("ieo", ieoView);
    var withheld = (o.suppressed_below_k && o.suppressed_below_k.progress) ? o.suppressed_below_k.progress.measureTotal : 0;
    var sourceCard = document.createElement("div");
    sourceCard.className = "card";
    sourceCard.appendChild(buildCardHead(
      "Source: warehouse · North America IEO platform (Steps 1–6)",
      "Generated " + new Date(o.generated_at).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }) +
      " · weeks run Monday–Sunday · counts under 5 are merged into \u201c(other) — region\u201d" +
      (withheld ? " · " + fmtInt(withheld) + " records withheld below that floor" : "")));
    content.appendChild(sourceCard);
    var allCenterNames = o.centers.map(function (c) { return c.center; }).sort();
    var ieoResolved = resolveCenterSelection(state.ieoCenters, allCenterNames);
    var selected = ieoResolved.selected;
    var isFiltered = ieoResolved.isFiltered;
    var filterSuffix = isFiltered ? (" · " + selected.size + " center" + (selected.size === 1 ? "" : "s") + " selected") : "";

    content.appendChild(buildFilterBar(allCenterNames, selected, function (newSelected) {
      state.ieoCenters = newSelected;
      render();
    }));

    // ---- Filtered aggregates (the "By center" rows already carry total/completed/
    // expired/active_step per center, so the top-line stats/highlights just re-sum them) ----
    var filteredCenters = isFiltered ? o.centers.filter(function (c) { return selected.has(c.center); }) : o.centers;
    var totalRecordsF = filteredCenters.reduce(function (a, c) { return a + c.total; }, 0);
    var completedF = filteredCenters.reduce(function (a, c) { return a + c.completed; }, 0);
    var expiredF = filteredCenters.reduce(function (a, c) { return a + c.expired; }, 0);
    var activeF = filteredCenters.reduce(function (a, c) { return a + c.active_step; }, 0);
    var completionRateF = totalRecordsF ? Math.round(1000 * completedF / totalRecordsF) / 10 : 0;

    var stepsList = o.funnel.map(function (f) { return f.step; });
    var funnelSums = sumFunnelByCenter(o.funnel_by_center, stepsList, selected);
    var funnelData = stepsList.map(function (s, i) { return { step: s, expired: funnelSums.expired[i], in_progress: funnelSums.active[i] }; });

    var langKeysList = o.languages.map(function (l) { return l.lang; });
    var langCounts = sumLangByCenter(o.languages_by_center, langKeysList, selected);
    var langTotalF = langCounts.reduce(function (a, b) { return a + b; }, 0);
    var languagesData = langKeysList.map(function (l, i) { return { lang: l, count: langCounts[i], pct: langTotalF ? Math.round(1000 * langCounts[i] / langTotalF) / 10 : 0 }; });

    var yearsList = o.yearly.map(function (y) { return y.year; });
    var yearlyCounts = sumYearlyByCenter(o.monthly_by_center, yearsList, "n", selected);
    var yearlyData = yearsList.map(function (y, i) { return { start: y, end: y, count: yearlyCounts[i] }; });

    var monthsLast12List = o.monthly_last12.map(function (x) { return x.month; });
    var monthlyLast12Counts = sumMonthlyByCenter(o.monthly_by_center, monthsLast12List, "n", selected);
    var monthlyLast12Data = monthsLast12List.map(function (mk, i) { return { start: mk, end: mk, count: monthlyLast12Counts[i] }; });
    var lastCompLabel = fmtMonthShort(monthsLast12List[monthsLast12List.length - 1]);
    var this_month = monthlyLast12Counts[monthlyLast12Counts.length - 1] || 0;
    var prev_month = monthlyLast12Counts.length > 1 ? monthlyLast12Counts[monthlyLast12Counts.length - 2] : 0;
    var delta_month = this_month - prev_month;

    var weeksList = o.weekly_recent.map(function (w) { return w.start; });
    var weeklyCounts = sumWeeklyByCenter(o.weekly_by_center, weeksList, "n", selected);
    var weeklyData = o.weekly_recent.map(function (w, i) { return { start: w.start, end: w.end, count: weeklyCounts[i] }; });
    var this_week = weeklyCounts[weeklyCounts.length - 1] || 0;
    var prev_week = weeklyCounts.length > 1 ? weeklyCounts[weeklyCounts.length - 2] : 0;
    var delta_week = this_week - prev_week;

    var filteredSteps = isFiltered ? o.steps_by_center.filter(function (r) { return selected.has(r.center); }) : o.steps_by_center;

    var items = [];
    items.push({
      dot: "is-new",
      build: function (row) {
        row.appendChild(document.createTextNode("Overall completion rate: "));
        var strong = document.createElement("strong");
        strong.textContent = completionRateF + "%";
        row.appendChild(strong);
        row.appendChild(document.createTextNode(" (" + fmtInt(completedF) + " of " + fmtInt(totalRecordsF) + " have completed all 7 steps)."));
      }
    });
    if (delta_week !== 0) {
      items.push({
        dot: delta_week > 0 ? "is-up" : "is-down",
        build: function (row) {
          row.appendChild(document.createTextNode("Weekly completions " + (delta_week > 0 ? "up " : "down ")));
          var strong = document.createElement("strong");
          strong.textContent = fmtInt(Math.abs(delta_week));
          row.appendChild(strong);
          row.appendChild(document.createTextNode(" vs the prior week."));
        }
      });
    }
    var worstStep = funnelData.slice().sort(function (a, b) { return b.expired - a.expired; })[0];
    if (worstStep && worstStep.expired > 0) {
      items.push({
        dot: "is-down",
        build: function (row) {
          row.appendChild(document.createTextNode("Biggest drop-off: Step "));
          var strong = document.createElement("strong");
          strong.textContent = worstStep.step;
          row.appendChild(strong);
          row.appendChild(document.createTextNode(" with " + fmtInt(worstStep.expired) + " expired (" + (expiredF ? Math.round(1000 * worstStep.expired / expiredF) / 10 : 0) + "% of all expired)."));
        }
      });
    }
    var topNonEnLang = languagesData.filter(function (l) { return l.lang !== "EN" && l.lang !== "Other" && l.count > 0; })[0];
    if (topNonEnLang) {
      items.push({
        dot: "is-soon",
        build: function (row) {
          row.appendChild(document.createTextNode("Top non-English language: "));
          var strong = document.createElement("strong");
          strong.textContent = topNonEnLang.lang;
          row.appendChild(strong);
          row.appendChild(document.createTextNode(" with " + fmtInt(topNonEnLang.count) + " people (" + topNonEnLang.pct + "%)."));
        }
      });
    }
    content.appendChild(buildHighlightsCard("What stands out · " + tabDef.label, "No notable changes.", items));

    // ---- Business insights: where people are lost, and where to focus to grow IEO ----
    var sortedByExpired = funnelData.slice().sort(function (a, b) { return b.expired - a.expired; });
    var topLeak = sortedByExpired[0];
    var secondLeak = sortedByExpired[1];
    var totalExpiredF = funnelData.reduce(function (a, f) { return a + f.expired; }, 0);
    var totalActiveF = funnelData.reduce(function (a, f) { return a + f.in_progress; }, 0);
    var topActiveStep = funnelData.slice().sort(function (a, b) { return b.in_progress - a.in_progress; })[0];
    var stepCount = stepsList.length;

    var bizInsights = [];

    if (topLeak && totalExpiredF > 0) {
      var topLeakPct = Math.round(1000 * topLeak.expired / totalExpiredF) / 10;
      var combinedPct = secondLeak ? Math.round(1000 * (topLeak.expired + secondLeak.expired) / totalExpiredF) / 10 : topLeakPct;
      var leakPosition = topLeak.step === stepsList[0] ? "the very first step" : (topLeak.step === stepsList[stepCount - 1] ? "the very last step, right before completion" : "step " + topLeak.step + " of " + stepCount);
      bizInsights.push({
        cls: "is-down",
        tag: "Where people are lost",
        headline: "Step " + topLeak.step,
        headlineSub: topLeakPct + "% of all drop-offs",
        body: function (el) {
          el.appendChild(document.createTextNode("This is " + leakPosition + ", and it accounts for more lost sign-ups than any other step: "));
          var strong = document.createElement("strong");
          strong.textContent = fmtInt(topLeak.expired) + " expired";
          el.appendChild(strong);
          el.appendChild(document.createTextNode(" here outright."));
          if (secondLeak && secondLeak.expired > 0) {
            el.appendChild(document.createTextNode(" Step " + secondLeak.step + " is the next-biggest leak (" + fmtInt(secondLeak.expired) + "). Together, these two steps account for " + combinedPct + "% of everyone who didn't finish — the highest-leverage place to simplify the process or add a reminder."));
          }
        }
      });
    }

    if (totalActiveF > 0 && topActiveStep) {
      bizInsights.push({
        cls: "is-soon",
        tag: "Recoverable right now",
        headline: fmtInt(totalActiveF),
        headlineSub: "still mid-process, not expired yet",
        body: function (el) {
          el.appendChild(document.createTextNode("These people haven't given up — they just haven't finished. The largest group is at "));
          var strong = document.createElement("strong");
          strong.textContent = "Step " + topActiveStep.step + " (" + fmtInt(topActiveStep.in_progress) + " people)";
          el.appendChild(strong);
          el.appendChild(document.createTextNode(". Reaching out before they time out is the fastest way to grow completions — no new sign-ups needed."));
        }
      });
    }

    var centerTotalsSorted = filteredCenters.map(function (c) { return c.total; }).sort(function (a, b) { return a - b; });
    var centerMedian = centerTotalsSorted.length ? centerTotalsSorted[Math.floor(centerTotalsSorted.length / 2)] : 0;
    var bigCenters = filteredCenters.filter(function (c) { return c.total >= centerMedian && c.total > 0; });
    var opportunityCenters = bigCenters
      .filter(function (c) { return c.completion_rate < completionRateF; })
      .map(function (c) { return { center: c.center, completion_rate: c.completion_rate, recoverable: c.total - c.completed }; })
      .sort(function (a, b) { return b.recoverable - a.recoverable; });

    if (bigCenters.length >= 3 && opportunityCenters.length > 0) {
      var topOpp = opportunityCenters.slice(0, 3);
      var oppRecoverableSum = topOpp.reduce(function (a, c) { return a + c.recoverable; }, 0);
      bizInsights.push({
        cls: "is-new",
        tag: "Biggest opportunity by center",
        headline: opportunityCenters.length + " center" + (opportunityCenters.length === 1 ? "" : "s") + " below average",
        headlineSub: fmtInt(oppRecoverableSum) + " recoverable in the top " + topOpp.length,
        body: function (el) {
          el.appendChild(document.createTextNode("Among centers with meaningful volume, these are furthest below the " + completionRateF + "% average completion rate: "));
          topOpp.forEach(function (c, i) {
            var strong = document.createElement("strong");
            strong.textContent = c.center;
            el.appendChild(strong);
            el.appendChild(document.createTextNode(" (" + c.completion_rate + "%, " + fmtInt(c.recoverable) + " could still finish)" + (i < topOpp.length - 1 ? "; " : ". ")));
          });
          el.appendChild(document.createTextNode("Follow-up support here reaches more people than an average center."));
        }
      });
    } else {
      bizInsights.push({
        cls: "is-new",
        tag: "Biggest opportunity by center",
        headline: "—",
        headlineSub: "not enough centers selected",
        body: "Select 3 or more centers (or clear the filter) to compare completion rates and see which ones have the most recoverable people."
      });
    }

    function medianOf(nums) {
      if (!nums.length) return 0;
      var s = nums.slice().sort(function (a, b) { return a - b; });
      var mid = Math.floor(s.length / 2);
      return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
    }
    var monthsExcludingCurrent = monthlyLast12Data.slice(0, -1);
    var monthsByCountDesc = monthsExcludingCurrent.slice().sort(function (a, b) { return b.count - a.count; });
    var peakMonth = monthsByCountDesc.length ? monthsByCountDesc[0] : null;
    var restMonths = monthsExcludingCurrent.filter(function (m) { return !peakMonth || m.start !== peakMonth.start; });
    // Median (not mean) so a second unusually-high month doesn't inflate the "typical month" baseline.
    var restMedian = medianOf(restMonths.map(function (m) { return m.count; }));
    var secondMonth = monthsByCountDesc.length > 1 ? monthsByCountDesc[1] : null;
    var alsoElevated = secondMonth && restMedian > 0 && secondMonth.count >= restMedian * 2;

    if (peakMonth && restMedian > 0 && peakMonth.count >= restMedian * 2) {
      var spikeMultiple = Math.round((peakMonth.count / restMedian) * 10) / 10;
      bizInsights.push({
        cls: "is-up",
        tag: "Momentum & seasonality",
        headline: alsoElevated ? (fmtMonthShort(peakMonth.start) + "–" + fmtMonthShort(secondMonth.start)) : fmtMonthShort(peakMonth.start),
        headlineSub: "~" + spikeMultiple + "x a typical month",
        body: function (el) {
          el.appendChild(document.createTextNode("Completions spiked to "));
          var strong = document.createElement("strong");
          strong.textContent = fmtInt(peakMonth.count);
          el.appendChild(strong);
          if (alsoElevated) {
            el.appendChild(document.createTextNode(" in " + fmtMonthShort(peakMonth.start) + " and stayed elevated at " + fmtInt(secondMonth.count) + " in " + fmtMonthShort(secondMonth.start)));
          }
          el.appendChild(document.createTextNode(", versus a typical " + fmtInt(Math.round(restMedian)) + " a month. Whatever drove that surge — a campaign, event, or push — is worth identifying and repeating."));
        }
      });
    } else {
      bizInsights.push({
        cls: delta_week >= 0 ? "is-up" : "is-down",
        tag: "Momentum",
        headline: (delta_week >= 0 ? "+" : "") + fmtInt(delta_week),
        headlineSub: "completions vs prior week",
        body: function (el) {
          el.appendChild(document.createTextNode("This week: "));
          var strong = document.createElement("strong");
          strong.textContent = fmtInt(this_week);
          el.appendChild(strong);
          el.appendChild(document.createTextNode(" vs " + fmtInt(prev_week) + " the week before. No outsized monthly spike in the last 12 months for this selection — growth here looks steady rather than event-driven."));
        }
      });
    }

    content.appendChild(buildInsightsCard("Business insights · growing IEO", "Where people are lost, and where to focus effort" + filterSuffix, bizInsights));

    var stats = [
      { label: "Total records", value: fmtInt(totalRecordsF), sub: "people with an IEO status" },
      { label: "Completed", value: fmtInt(completedF), sub: completionRateF + "% completion rate" },
      { label: "Expired mid-step", value: fmtInt(expiredF), sub: "steps 1–7 · timed out before finishing" },
      { label: "Active mid-step", value: fmtInt(activeF), sub: "steps 1–7 · still in progress" }
    ];
    content.appendChild(buildStatRow(stats));

    var funnelCard = document.createElement("div");
    funnelCard.className = "card";
    funnelCard.appendChild(buildCardHead("IEO step funnel", "Steps 1–7 · where people stall vs stay active" + filterSuffix));
    funnelCard.appendChild(buildLegendRow([{ cls: "is-series", label: "Expired" }, { cls: "is-accent", label: "In progress" }]));

    var funnelGrid = document.createElement("div");
    funnelGrid.className = "chart-grid-2";

    var expiredSub = document.createElement("div");
    expiredSub.className = "chart-sub-card";
    expiredSub.appendChild(buildCardHead("Expired"));
    expiredSub.appendChild(buildChart(
      funnelData.map(function (f) { return { start: f.step, end: f.step, count: f.expired }; }),
      { unitLabel: "people", ariaLabel: "Expired by step", xLabelFmt: function (w) { return "Step " + w.start; }, rangeFmt: function (w) { return "Step " + w.start; } }
    ));
    funnelGrid.appendChild(expiredSub);

    var activeSub = document.createElement("div");
    activeSub.className = "chart-sub-card";
    activeSub.appendChild(buildCardHead("In progress"));
    activeSub.appendChild(buildChart(
      funnelData.map(function (f) { return { start: f.step, end: f.step, count: f.in_progress }; }),
      { unitLabel: "people", ariaLabel: "In progress by step", colorClass: "accent", xLabelFmt: function (w) { return "Step " + w.start; }, rangeFmt: function (w) { return "Step " + w.start; } }
    ));
    funnelGrid.appendChild(activeSub);

    funnelCard.appendChild(funnelGrid);
    content.appendChild(funnelCard);

    var langCard = document.createElement("div");
    langCard.className = "card";
    langCard.appendChild(buildCardHead("Language preference", fmtInt(totalRecordsF) + " people · top languages" + filterSuffix));
    langCard.appendChild(buildChart(
      languagesData.map(function (l) { return { start: l.lang, end: l.lang, count: l.count }; }),
      { unitLabel: "people", ariaLabel: "IEO participants by language", xLabelFmt: function (w) { return w.start; }, rangeFmt: function (w) { return w.start; } }
    ));
    content.appendChild(langCard);

    var tableCard = document.createElement("div");
    tableCard.className = "card";
    tableCard.appendChild(buildCardHead("By center", filteredCenters.length + " centers · sort any column"));
    var cols = [
      { key: "center", label: "Center", align: "left", sticky: true },
      { key: "total", label: "Total", align: "right" },
      { key: "completed", label: "Completed", align: "right" },
      { key: "completion_rate", label: "Completion rate", align: "right", render: function (td, row) { td.textContent = row.completion_rate + "%"; } },
      { key: "expired", label: "Expired mid-step", align: "right" }
    ];
    tableCard.appendChild(buildGenericTable(filteredCenters, state.sortKey, state.sortDir, function (key) {
      state.sortDir = (state.sortKey === key) ? (state.sortDir === "asc" ? "desc" : "asc") : (key === "center" ? "asc" : "desc");
      state.sortKey = key;
      render();
    }, cols));
    content.appendChild(tableCard);

    // ---- Completions over time (weekly progress) ----
    var yearlyCard = document.createElement("div");
    yearlyCard.className = "card";
    yearlyCard.appendChild(buildCardHead("Completions by year", yearsList[0] + " – " + yearsList[yearsList.length - 1] + " · dated completions only" + filterSuffix));
    yearlyCard.appendChild(buildChart(
      yearlyData,
      { unitLabel: "completions", ariaLabel: "IEO completions by year", xLabelFmt: function (w) { return w.start; }, rangeFmt: function (w) { return w.start; } }
    ));
    content.appendChild(yearlyCard);

    var monthlyCard = document.createElement("div");
    monthlyCard.className = "card";
    monthlyCard.appendChild(buildCardHead("Completions — last 12 months", fmtMonthShort(monthsLast12List[0]) + " – " + lastCompLabel + filterSuffix));
    monthlyCard.appendChild(buildChart(
      monthlyLast12Data,
      { unitLabel: "completions", ariaLabel: "IEO completions by month", xLabelFmt: function (w) { return fmtMonthShort(w.start); }, rangeFmt: function (w) { return fmtMonthShort(w.start); } }
    ));
    content.appendChild(monthlyCard);

    var weeklyCard = document.createElement("div");
    weeklyCard.className = "card";
    weeklyCard.appendChild(buildCardHead("Completions — weekly", fmtDateMid(weeklyData[0].start) + " – " + fmtDateMid(weeklyData[weeklyData.length - 1].end) + filterSuffix));
    weeklyCard.appendChild(buildChart(weeklyData, { unitLabel: "completions", ariaLabel: "Weekly IEO completions" }));
    content.appendChild(weeklyCard);

    var weeklyTableCard = document.createElement("div");
    weeklyTableCard.className = "card";
    weeklyTableCard.appendChild(buildCardHead("Weekly completions breakdown", weeklyData.length + " weeks · sort any column"));
    var weeklyCols = [
      { key: "start", label: "Week of", align: "left", sticky: true, render: function (td, row) { td.textContent = fmtDateMid(row.start); } },
      { key: "count", label: "Completions", align: "right" }
    ];
    weeklyTableCard.appendChild(buildGenericTable(weeklyData, state.sortKey2, state.sortDir2, function (key) {
      state.sortDir2 = (state.sortKey2 === key) ? (state.sortDir2 === "asc" ? "desc" : "asc") : "desc";
      state.sortKey2 = key;
      render();
    }, weeklyCols));
    content.appendChild(weeklyTableCard);

    // ---- Steps by center ----
    var stepsCard = document.createElement("div");
    stepsCard.className = "card";
    stepsCard.appendChild(buildCardHead("Steps by center", filteredSteps.length + " centers · people currently sitting at each step · sort any column"));
    var stepCols = [{ key: "center", label: "Center", align: "left", sticky: true }];
    STEP_LABELS.forEach(function (s) {
      stepCols.push({ key: "s" + s, label: "Step " + s, align: "right" });
    });
    stepCols.push({ key: "completed", label: "Completed", align: "right" });
    stepCols.push({ key: "total", label: "Total", align: "right" });
    stepsCard.appendChild(buildGenericTable(filteredSteps, state.sortKey3, state.sortDir3, function (key) {
      state.sortDir3 = (state.sortKey3 === key) ? (state.sortDir3 === "asc" ? "desc" : "asc") : (key === "center" ? "asc" : "desc");
      state.sortKey3 = key;
      render();
    }, stepCols));
    content.appendChild(stepsCard);
  }

  // ---------- Visits tab ----------
  // As of this rebuild, "Visits"/Count is retired as a metric entirely — the source data no longer
  // carries a Count/Unique.Accounts column, and per explicit user instruction the tab now tracks
  // exactly two co-equal measures, Adults and Children, shown together everywhere a number appears.
  var VISIT_TYPE_DEFS = [
    { key: "program", label: "Program visit" },
    { key: "overnight", label: "Overnight visit" },
    { key: "day", label: "Day visit" },
    { key: "volunteer", label: "Volunteering" }
  ];

  // Merges arrays of {<keyField>: ..., ...numeric fields} records from several center subsets
  // into one, unioning keys (a center can have a year/week/day the others don't) and summing every
  // numeric field under each key — same "match by key, not index" principle as combinedDailyPeak()
  // elsewhere, needed because per-center yearly/daily arrays aren't guaranteed to line up 1:1.
  function mergeByKey(arraysOfArrays, keyField) {
    var map = {};
    var order = [];
    arraysOfArrays.forEach(function (arr) {
      arr.forEach(function (obj) {
        var k = obj[keyField];
        if (!(k in map)) {
          var copy = {};
          Object.keys(obj).forEach(function (f) { copy[f] = obj[f]; });
          map[k] = copy;
          order.push(k);
        } else {
          var acc = map[k];
          Object.keys(obj).forEach(function (f) {
            if (typeof obj[f] === "number") acc[f] = (acc[f] || 0) + obj[f];
          });
        }
      });
    });
    order.sort();
    return order.map(function (k) { return map[k]; });
  }

  // Combines several EXTRA.visit.by_center[...] sections (each already fully self-consistent,
  // including its own undated/placeholder/corrupted-row handling from build_visit_section) into one
  // section-shaped object, for a center-filter selection covering more than one center. Every field
  // here mirrors what the Python side ships, so the rest of renderVisitTab can treat the merged
  // result exactly like the unfiltered EXTRA.visit object — no separate "filtered" code paths.
  function mergeVisitParts(parts) {
    if (parts.length === 1) return parts[0];

    var totalAdults = 0, totalChildren = 0;
    var undated = 0, excludedPlaceholder = 0, corruptedExcluded = 0;
    var minDate = null, maxDate = null;
    parts.forEach(function (p) {
      totalAdults += p.total_adults;
      totalChildren += p.total_children;
      undated += p.undated_rows;
      excludedPlaceholder += p.excluded_placeholder_rows;
      corruptedExcluded += p.corrupted_values_excluded;
      if (minDate === null || p.min_date < minDate) minDate = p.min_date;
      if (maxDate === null || p.max_date > maxDate) maxDate = p.max_date;
    });

    var yearly = mergeByKey(parts.map(function (p) { return p.yearly; }), "year");
    var monthlyLast12 = mergeByKey(parts.map(function (p) { return p.monthly_last12; }), "month");
    var weeklyRecent = mergeByKey(parts.map(function (p) { return p.weekly_recent; }), "start");
    var weeklyByType = mergeByKey(parts.map(function (p) { return p.weekly_by_type; }), "start");
    var weeklyByStay = mergeByKey(parts.map(function (p) { return p.weekly_by_stay; }), "start");
    var daily = mergeByKey(parts.map(function (p) { return p.daily; }), "date");

    var typeMap = {}, typeOrder = [];
    parts.forEach(function (p) {
      p.visit_types.forEach(function (t) {
        if (!(t.type in typeMap)) { typeMap[t.type] = { adults: 0, children: 0 }; typeOrder.push(t.type); }
        typeMap[t.type].adults += t.adults;
        typeMap[t.type].children += t.children;
      });
    });
    var totalPeople = totalAdults + totalChildren;
    var visitTypes = typeOrder.map(function (t) {
      var total = typeMap[t].adults + typeMap[t].children;
      return { type: t, adults: typeMap[t].adults, children: typeMap[t].children, total: total, pct: totalPeople ? Math.round(1000 * total / totalPeople) / 10 : 0 };
    }).sort(function (a, b) { return b.total - a.total; });

    var catMap = {}, catOrder = [], catLabel = {};
    parts.forEach(function (p) {
      p.days_categories.forEach(function (c) {
        if (!(c.category in catMap)) { catMap[c.category] = { adults: 0, children: 0 }; catOrder.push(c.category); catLabel[c.category] = c.label; }
        catMap[c.category].adults += c.adults;
        catMap[c.category].children += c.children;
      });
    });
    var daysCategories = catOrder.map(function (c) { return { category: c, label: catLabel[c], adults: catMap[c].adults, children: catMap[c].children }; });

    var thisMonthAdults = monthlyLast12.length ? monthlyLast12[monthlyLast12.length - 1].adults : 0;
    var thisMonthChildren = monthlyLast12.length ? monthlyLast12[monthlyLast12.length - 1].children : 0;
    var prevMonthAdults = monthlyLast12.length > 1 ? monthlyLast12[monthlyLast12.length - 2].adults : 0;
    var prevMonthChildren = monthlyLast12.length > 1 ? monthlyLast12[monthlyLast12.length - 2].children : 0;
    var thisWeekAdults = weeklyRecent.length ? weeklyRecent[weeklyRecent.length - 1].adults : 0;
    var thisWeekChildren = weeklyRecent.length ? weeklyRecent[weeklyRecent.length - 1].children : 0;
    var prevWeekAdults = weeklyRecent.length > 1 ? weeklyRecent[weeklyRecent.length - 2].adults : 0;
    var prevWeekChildren = weeklyRecent.length > 1 ? weeklyRecent[weeklyRecent.length - 2].children : 0;

    return {
      today: parts[0].today,
      min_date: minDate, max_date: maxDate,
      total_adults: totalAdults, total_children: totalChildren,
      undated_rows: undated, excluded_placeholder_rows: excludedPlaceholder, corrupted_values_excluded: corruptedExcluded,
      visit_types: visitTypes,
      days_categories: daysCategories,
      days_cat_defs: parts[0].days_cat_defs, // fixed set of 6 buckets shipped identically by every part
      yearly: yearly,
      monthly_last12: monthlyLast12,
      weekly_recent: weeklyRecent,
      weekly_by_type: weeklyByType,
      weekly_by_stay: weeklyByStay,
      this_month_adults: thisMonthAdults, prev_month_adults: prevMonthAdults, delta_month_adults: thisMonthAdults - prevMonthAdults,
      this_month_children: thisMonthChildren, prev_month_children: prevMonthChildren, delta_month_children: thisMonthChildren - prevMonthChildren,
      this_week_adults: thisWeekAdults, prev_week_adults: prevWeekAdults, delta_week_adults: thisWeekAdults - prevWeekAdults,
      this_week_children: thisWeekChildren, prev_week_children: prevWeekChildren, delta_week_children: thisWeekChildren - prevWeekChildren,
      daily: daily
    };
  }

  // selected: a Set of center keys from resolveCenterSelection(), or null. null (or a Set covering
  // every center) is the tab's default — returns the top-level EXTRA.visit object unchanged (exact
  // byte-for-byte match with the dashboard's original unfiltered numbers, no re-summing needed).
  function resolveVisitData(v, selected) {
    if (selected === null || selected.size === v.centers.length) return v;
    var parts = v.centers.filter(function (c) { return selected.has(c); }).map(function (c) { return v.by_center[c]; });
    if (parts.length === 0) return v;
    return mergeVisitParts(parts);
  }

  // Reusable "Visitors" section merged into a single-center program tab (iiis, IYCLA) — added when
  // the standalone "Ashram visitors" tab was split and folded into those tabs per explicit user
  // request. center is a single center key ("iii" or "LA"); resolveVisitData/mergeVisitParts take
  // the parts.length === 1 shortcut and return v.by_center[center] directly, shaped identically to
  // the old unfiltered object, so the rest of this function is otherwise unchanged from the former
  // standalone renderVisitTab. There is no center filter bar here (unlike the old standalone tab) —
  // the section is already scoped to one center by which program tab it's rendered inside.
  //
  // Sort-state slots: this section reuses slots 2-6 (never slot 1, which the enclosing
  // renderProgramsTab's own main program table already owns) — compare-windows table on slot 2,
  // weekly breakdown on slot 3, weekly-by-type on slot 4, weekly-by-stay on slot 5, sathsang-center
  // breakdown on slot 6.
  function renderVisitorsSection(content, center) {
    if (!REPORTS.visits) { content.appendChild(reportStatusCard("visits", "Visitor data")); return; }
    var v = reportView("visits", visitsView);
    content.appendChild(reportSourceCard(REPORTS.visits, "Source: warehouse · Visitors",
      "adult guest counts missing before Nov 2025 · visit type derived from purpose · weeks run Monday–Sunday"));
    var vv = resolveVisitData(v, new Set([center]));

    content.appendChild(buildSectionHeading("Visitors", "Adults and children visiting this Ashram location"));

    if (!state.visitWinA) {
      var aEnd = vv.today;
      var aStart = addDays(vv.today, -29);
      state.visitWinA = { start: aStart, end: aEnd };
    }
    if (!state.visitWinB) {
      var bEnd = addDays(state.visitWinA.start, -1);
      var bStart = addDays(bEnd, -29);
      state.visitWinB = { start: bStart, end: bEnd };
    }

    // Per explicit user instruction, there is no bare "count" figure anywhere on this tab any
    // more — every highlight/stat/chart/table states Adults and Children side by side, since
    // those are the only two categories this dataset supports.
    var items = [];
    if (vv.delta_week_adults !== 0 || vv.delta_week_children !== 0) {
      items.push({
        dot: (vv.delta_week_adults + vv.delta_week_children) >= 0 ? "is-up" : "is-down",
        build: function (row) {
          row.appendChild(document.createTextNode("This week vs prior week: adults "));
          var s1 = document.createElement("strong");
          s1.textContent = (vv.delta_week_adults > 0 ? "+" : "") + fmtInt(vv.delta_week_adults);
          row.appendChild(s1);
          row.appendChild(document.createTextNode(", children "));
          var s2 = document.createElement("strong");
          s2.textContent = (vv.delta_week_children > 0 ? "+" : "") + fmtInt(vv.delta_week_children);
          row.appendChild(s2);
          row.appendChild(document.createTextNode("."));
        }
      });
    }
    if (vv.delta_month_adults !== 0 || vv.delta_month_children !== 0) {
      items.push({
        dot: (vv.delta_month_adults + vv.delta_month_children) >= 0 ? "is-up" : "is-down",
        build: function (row) {
          row.appendChild(document.createTextNode("This month vs last month: adults "));
          var s1 = document.createElement("strong");
          s1.textContent = (vv.delta_month_adults > 0 ? "+" : "") + fmtInt(vv.delta_month_adults);
          row.appendChild(s1);
          row.appendChild(document.createTextNode(", children "));
          var s2 = document.createElement("strong");
          s2.textContent = (vv.delta_month_children > 0 ? "+" : "") + fmtInt(vv.delta_month_children);
          row.appendChild(s2);
          row.appendChild(document.createTextNode("."));
        }
      });
    }
    var topType = vv.visit_types[0];
    items.push({
      dot: "is-soon",
      build: function (row) {
        row.appendChild(document.createTextNode("Busiest visit type: "));
        var strong = document.createElement("strong");
        strong.textContent = topType.type;
        row.appendChild(strong);
        row.appendChild(document.createTextNode(" with " + fmtInt(topType.adults) + " adults and " + fmtInt(topType.children) + " children (" + topType.pct + "% of all people)."));
      }
    });
    content.appendChild(buildHighlightsCard("What stands out · Visitors", "No notable changes.", items));

    // Note: this dataset has no member-level identity and, as of this rebuild, no Count/
    // Unique.Accounts column at all — there is nothing to build a "Total visitors"/"Total
    // headcount" figure from any more. Adults and Children are the only two measures the source
    // data supports, so they're what's shown, together, at every cadence below.
    //
    // The "Adults — all time" / "Children — all time" stat row was removed per explicit user
    // instruction: the all-time Adults figure (Count + Total.Adults summed across every row ever)
    // produces an implausibly large number once repeat visits/bookings accumulate over years, and
    // the user flagged it as not a trustworthy figure. This-week/this-month (below) are much
    // shorter, bounded windows and aren't affected by the same issue.
    content.appendChild(buildStatRow([
      { label: "Adults — this week", value: fmtInt(vv.this_week_adults), sub: fmtDateMid(vv.weekly_recent[vv.weekly_recent.length - 1].end), delta: vv.delta_week_adults, deltaVsLabel: "prior week" },
      { label: "Children — this week", value: fmtInt(vv.this_week_children), sub: fmtDateMid(vv.weekly_recent[vv.weekly_recent.length - 1].end), delta: vv.delta_week_children, deltaVsLabel: "prior week" }
    ]));

    content.appendChild(buildStatRow([
      { label: "Adults — this month", value: fmtInt(vv.this_month_adults), sub: "through " + fmtDateMid(vv.today), delta: vv.delta_month_adults, deltaVsLabel: "last month" },
      { label: "Children — this month", value: fmtInt(vv.this_month_children), sub: "through " + fmtDateMid(vv.today), delta: vv.delta_month_children, deltaVsLabel: "last month" }
    ]));

    // ---- Compare two windows ----
    var compareCard = document.createElement("div");
    compareCard.className = "card";
    compareCard.appendChild(buildCardHead("Compare two windows", "Pick any two date ranges to compare adults and children"));

    var windowsRow = document.createElement("div");
    windowsRow.className = "compare-windows";

    var DATE_FIELD_ICON_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.8" width="13" height="11.7" rx="1.5"/><line x1="1.5" y1="6.2" x2="14.5" y2="6.2"/><line x1="4.5" y1="1" x2="4.5" y2="4"/><line x1="11.5" y1="1" x2="11.5" y2="4"/></svg>';

    // Native <input type="date"> displays in the browser's own locale order
    // (day-first in many locales). We keep the native input for its calendar
    // picker and keyboard/a11y behavior, but hide its own text and show a
    // month-first label (via fmtDateMid) stacked on top instead, so the
    // displayed date is always month, day, year regardless of visitor locale.
    function buildDateField(value, min, max) {
      var field = document.createElement("div");
      field.className = "date-field";

      var input = document.createElement("input");
      input.type = "date";
      input.className = "date-field-native";
      input.value = value;
      input.min = min;
      input.max = max;
      input.setAttribute("aria-label", "Choose date (" + fmtDateMid(value) + ")");

      var displayBox = document.createElement("div");
      displayBox.className = "date-field-display";
      var textSpan = document.createElement("span");
      textSpan.className = "date-field-text";
      textSpan.textContent = fmtDateMid(value);
      var iconSpan = document.createElement("span");
      iconSpan.className = "date-field-icon";
      iconSpan.innerHTML = DATE_FIELD_ICON_SVG;
      displayBox.appendChild(textSpan);
      displayBox.appendChild(iconSpan);

      input.addEventListener("input", function () {
        if (input.value) {
          textSpan.textContent = fmtDateMid(input.value);
          input.setAttribute("aria-label", "Choose date (" + fmtDateMid(input.value) + ")");
        }
      });

      field.appendChild(input);
      field.appendChild(displayBox);
      return { field: field, input: input };
    }

    function buildWindowField(labelText, swatchClass, win, onChange, minD, maxD) {
      // minD/maxD default to the (possibly center-filtered) vv's own range — pass them explicitly
      // for a tool that deliberately ignores the top filter (e.g. the sathsang-center breakdown,
      // which always spans the full unfiltered v.min_date/v.max_date).
      if (minD === undefined) minD = vv.min_date;
      if (maxD === undefined) maxD = vv.max_date;
      var wrap = document.createElement("div");
      wrap.className = "compare-window";
      var label = document.createElement("div");
      label.className = "compare-window-label";
      var sw = document.createElement("span");
      sw.className = "swatch " + swatchClass;
      label.appendChild(sw);
      label.appendChild(document.createTextNode(labelText));
      wrap.appendChild(label);

      var inputsRow = document.createElement("div");
      inputsRow.className = "compare-date-inputs";
      var startField = buildDateField(win.start, minD, maxD);
      var toSpan = document.createElement("span");
      toSpan.textContent = "to";
      var endField = buildDateField(win.end, minD, maxD);

      function commit() {
        var s = startField.input.value, e = endField.input.value;
        if (!s || !e) return;
        if (s > e) { var tmp = s; s = e; e = tmp; }
        onChange({ start: s, end: e });
        render();
      }
      startField.input.addEventListener("change", commit);
      endField.input.addEventListener("change", commit);

      inputsRow.appendChild(startField.field);
      inputsRow.appendChild(toSpan);
      inputsRow.appendChild(endField.field);
      wrap.appendChild(inputsRow);

      var daysNote = document.createElement("div");
      daysNote.className = "compare-window-days";
      var nDays = Math.round((new Date(win.end + "T00:00:00") - new Date(win.start + "T00:00:00")) / 86400000) + 1;
      daysNote.textContent = nDays + " day" + (nDays === 1 ? "" : "s");
      wrap.appendChild(daysNote);

      return wrap;
    }

    windowsRow.appendChild(buildWindowField("Window A", "is-a", state.visitWinA, function (w) { state.visitWinA = w; }));
    var vsDiv = document.createElement("div");
    vsDiv.className = "compare-vs";
    vsDiv.textContent = "vs";
    windowsRow.appendChild(vsDiv);
    windowsRow.appendChild(buildWindowField("Window B", "is-b", state.visitWinB, function (w) { state.visitWinB = w; }));

    compareCard.appendChild(windowsRow);

    var winA = sumDailyRange(vv.daily, state.visitWinA.start, state.visitWinA.end);
    var winB = sumDailyRange(vv.daily, state.visitWinB.start, state.visitWinB.end);

    var labelA = document.createElement("p");
    labelA.className = "compare-section-label";
    labelA.textContent = "Window A · " + fmtDateMid(state.visitWinA.start) + " – " + fmtDateMid(state.visitWinA.end);
    compareCard.appendChild(labelA);
    compareCard.appendChild(buildStatRow([
      { label: "Adults", value: fmtInt(winA.adults), sub: "accompanying adults" },
      { label: "Children", value: fmtInt(winA.children), sub: "accompanying children" }
    ]));

    var labelB = document.createElement("p");
    labelB.className = "compare-section-label";
    labelB.textContent = "Window B · " + fmtDateMid(state.visitWinB.start) + " – " + fmtDateMid(state.visitWinB.end);
    compareCard.appendChild(labelB);
    compareCard.appendChild(buildStatRow([
      { label: "Adults", value: fmtInt(winB.adults), sub: "accompanying adults", delta: winB.adults - winA.adults, deltaVsLabel: "Window A" },
      { label: "Children", value: fmtInt(winB.children), sub: "accompanying children", delta: winB.children - winA.children, deltaVsLabel: "Window A" }
    ]));

    var typeRows = VISIT_TYPE_DEFS.map(function (t) {
      return {
        type: t.label,
        a_adults: winA[t.key + "_adults"], a_children: winA[t.key + "_children"],
        b_adults: winB[t.key + "_adults"], b_children: winB[t.key + "_children"],
        delta_adults: winB[t.key + "_adults"] - winA[t.key + "_adults"],
        delta_children: winB[t.key + "_children"] - winA[t.key + "_children"]
      };
    });
    var typeCols = [
      { key: "type", label: "Visit type", align: "left", sticky: true },
      { key: "a_adults", label: "Window A — Adults", align: "right" },
      { key: "a_children", label: "Window A — Children", align: "right" },
      { key: "b_adults", label: "Window B — Adults", align: "right" },
      { key: "b_children", label: "Window B — Children", align: "right" },
      { key: "delta_adults", label: "Δ Adults", align: "right", render: function (td, row) { td.textContent = (row.delta_adults > 0 ? "+" : "") + fmtInt(row.delta_adults); } },
      { key: "delta_children", label: "Δ Children", align: "right", render: function (td, row) { td.textContent = (row.delta_children > 0 ? "+" : "") + fmtInt(row.delta_children); } }
    ];
    compareCard.appendChild(buildGenericTable(typeRows, state.sortKey2, state.sortDir2, function (key) {
      state.sortDir2 = (state.sortKey2 === key) ? (state.sortDir2 === "asc" ? "desc" : "asc") : (key === "type" ? "asc" : "desc");
      state.sortKey2 = key;
      render();
    }, typeCols));

    content.appendChild(compareCard);

    // ---- Visitors by sathsang center ----
    // Per explicit user request: pick any date range and see adults/children broken down by the
    // visitor's home sathsang center (Atlanta, Nashville, "Out of North America", etc. — the same
    // kind of center used elsewhere in this dashboard for Meditators/IEO). This is a DIFFERENT,
    // orthogonal dimension from the "Centers" filter bar at the top of this tab (iii/LA = which
    // physical Ashram location was visited); this tool always covers both combined, regardless of
    // that filter's selection — the subtitle below says so explicitly rather than leaving it to be
    // discovered by surprise. Built from EXTRA.visit.daily_by_satsang (unfiltered v, not vv) via
    // sumSatsangRange(), the same "ship per-day raw data, sum an arbitrary range client-side"
    // pattern as sumDailyRange()/"Compare two windows" above — just grouped by center instead of
    // collapsed to one total.
    if (!state.visitSatsangRange) {
      var satsangEnd = v.today;
      var satsangStart = addDays(v.today, -29);
      state.visitSatsangRange = { start: satsangStart, end: satsangEnd };
    }

    var satsangCard = document.createElement("div");
    satsangCard.className = "card";
    satsangCard.appendChild(buildCardHead("Visitors by sathsang center", "Pick a date range — adults + children by home sathsang center, across all Ashram locations (iii + LA combined), independent of the Centers filter above"));

    var satsangRow = document.createElement("div");
    satsangRow.className = "compare-windows";
    satsangRow.appendChild(buildWindowField("Period", "is-a", state.visitSatsangRange, function (w) { state.visitSatsangRange = w; }, v.min_date, v.max_date));
    satsangCard.appendChild(satsangRow);

    var satsangRows = sumSatsangRange(v.daily_by_satsang, state.visitSatsangRange.start, state.visitSatsangRange.end);
    var satsangTotalAdults = satsangRows.reduce(function (s, r) { return s + r.adults; }, 0);
    var satsangTotalChildren = satsangRows.reduce(function (s, r) { return s + r.children; }, 0);

    var satsangLabel = document.createElement("p");
    satsangLabel.className = "compare-section-label";
    satsangLabel.textContent = fmtDateMid(state.visitSatsangRange.start) + " – " + fmtDateMid(state.visitSatsangRange.end) + " · " +
      satsangRows.length + " sathsang center" + (satsangRows.length === 1 ? "" : "s") + " · " +
      fmtInt(satsangTotalAdults) + " adults, " + fmtInt(satsangTotalChildren) + " children";
    satsangCard.appendChild(satsangLabel);

    var satsangCols = [
      { key: "center", label: "Sathsang center", align: "left", sticky: true },
      { key: "adults", label: "Adults", align: "right" },
      { key: "children", label: "Children", align: "right" },
      { key: "total", label: "Total", align: "right" }
    ];
    var satsangTable = buildGenericTable(satsangRows, state.sortKey6, state.sortDir6, function (key) {
      state.sortDir6 = (state.sortKey6 === key) ? (state.sortDir6 === "asc" ? "desc" : "asc") : (key === "center" ? "asc" : "desc");
      state.sortKey6 = key;
      render();
    }, satsangCols, "No visitors in this date range.");

    // Prepend a Totals row that always stays first regardless of how the table below it is
    // sorted (per explicit user request). Done here rather than inside buildGenericTable
    // itself, since that helper is shared by other tables that don't want a totals row.
    if (satsangRows.length > 0) {
      var satsangTbody = satsangTable.querySelector("tbody");
      var totalTr = document.createElement("tr");
      totalTr.className = "total-row";
      satsangCols.forEach(function (col) {
        var td = document.createElement("td");
        if (col.align === "right") td.classList.add("num-cell");
        if (col.sticky) td.classList.add("sticky-col");
        if (col.key === "center") td.textContent = "All sathsang centers";
        else if (col.key === "adults") td.textContent = fmtInt(satsangTotalAdults);
        else if (col.key === "children") td.textContent = fmtInt(satsangTotalChildren);
        else if (col.key === "total") td.textContent = fmtInt(satsangTotalAdults + satsangTotalChildren);
        totalTr.appendChild(td);
      });
      satsangTbody.insertBefore(totalTr, satsangTbody.firstChild);
    }

    satsangCard.appendChild(satsangTable);
    content.appendChild(satsangCard);

    // ---- Adults / Children over time ----
    // Two single-metric charts side by side (same pattern as App Data's "Weekly downloads" —
    // MOM vs Sadhguru) rather than one dual-axis chart, since this dashboard never mixes two
    // scales on one axis. Both share the same time buckets, so they read as one comparison.
    var yearlyGrid = document.createElement("div");
    yearlyGrid.className = "chart-grid-2";
    var yearlyAdultsSub = document.createElement("div");
    yearlyAdultsSub.className = "chart-sub-card";
    yearlyAdultsSub.appendChild(buildCardHead("Adults by year", vv.yearly[0].year + " – " + vv.yearly[vv.yearly.length - 1].year));
    yearlyAdultsSub.appendChild(buildChart(
      vv.yearly.map(function (y) { return { start: y.year, end: y.year, count: y.adults }; }),
      { unitLabel: "adults", ariaLabel: "Adults by year", xLabelFmt: function (w) { return w.start; }, rangeFmt: function (w) { return w.start; } }
    ));
    yearlyGrid.appendChild(yearlyAdultsSub);
    var yearlyChildrenSub = document.createElement("div");
    yearlyChildrenSub.className = "chart-sub-card";
    yearlyChildrenSub.appendChild(buildCardHead("Children by year", vv.yearly[0].year + " – " + vv.yearly[vv.yearly.length - 1].year));
    yearlyChildrenSub.appendChild(buildChart(
      vv.yearly.map(function (y) { return { start: y.year, end: y.year, count: y.children }; }),
      { unitLabel: "children", ariaLabel: "Children by year", colorClass: "accent", xLabelFmt: function (w) { return w.start; }, rangeFmt: function (w) { return w.start; } }
    ));
    yearlyGrid.appendChild(yearlyChildrenSub);
    content.appendChild(yearlyGrid);

    var monthlyGrid = document.createElement("div");
    monthlyGrid.className = "chart-grid-2";
    var monthlyAdultsSub = document.createElement("div");
    monthlyAdultsSub.className = "chart-sub-card";
    monthlyAdultsSub.appendChild(buildCardHead("Adults — last 12 months", fmtMonthShort(vv.monthly_last12[0].month) + " – " + fmtMonthShort(vv.monthly_last12[vv.monthly_last12.length - 1].month)));
    monthlyAdultsSub.appendChild(buildChart(
      vv.monthly_last12.map(function (m) { return { start: m.month, end: m.month, count: m.adults }; }),
