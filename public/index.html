<meta charset="utf-8">
<title>Current Program Registrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ground:        #f7f6f2;
    --surface:       #ffffff;
    --surface-alt:   #f0eee5;
    --ink:           #17140f;
    --ink-secondary: #5a564a;
    --ink-muted:     #8b8779;
    --hairline:      #e2ded2;
    --baseline:      #cac5b6;
    --accent:        #c9861a;
    --accent-tint:   #f7e6c8;
    --accent-ink:    #4a3106;
    --series:        #2a78d6;
    --series-tint:   rgba(42,120,214,0.10);
    --series-muted:  #c3d9f3;
    --good:          #006300;
    --bad:           #b42323;
    --focus-ring:     #2a78d6;
    --shadow: 0 1px 2px rgba(23,20,15,0.04), 0 8px 24px rgba(23,20,15,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:        #0c0c0b;
      --surface:       #17160f;
      --surface-alt:   #1f1d15;
      --ink:           #f7f5ef;
      --ink-secondary: #c6c1b0;
      --ink-muted:     #928d7c;
      --hairline:      #2d2a20;
      --baseline:      #3a3627;
      --accent:        #eda100;
      --accent-tint:   #3a2c0c;
      --accent-ink:    #ffd985;
      --series:        #3987e5;
      --series-tint:   rgba(57,135,229,0.16);
      --series-muted:  #2c4a72;
      --good:          #0ca30c;
      --bad:           #e66767;
      --focus-ring:     #6fa8ec;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:        #0c0c0b;
    --surface:       #17160f;
    --surface-alt:   #1f1d15;
    --ink:           #f7f5ef;
    --ink-secondary: #c6c1b0;
    --ink-muted:     #928d7c;
    --hairline:      #2d2a20;
    --baseline:      #3a3627;
    --accent:        #eda100;
    --accent-tint:   #3a2c0c;
    --accent-ink:    #ffd985;
    --series:        #3987e5;
    --series-tint:   rgba(57,135,229,0.16);
    --series-muted:  #2c4a72;
    --good:          #0ca30c;
    --bad:           #e66767;
    --focus-ring:     #6fa8ec;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --ground:        #f7f6f2;
    --surface:       #ffffff;
    --surface-alt:   #f0eee5;
    --ink:           #17140f;
    --ink-secondary: #5a564a;
    --ink-muted:     #8b8779;
    --hairline:      #e2ded2;
    --baseline:      #cac5b6;
    --accent:        #c9861a;
    --accent-tint:   #f7e6c8;
    --accent-ink:    #4a3106;
    --series:        #2a78d6;
    --series-tint:   rgba(42,120,214,0.10);
    --series-muted:  #c3d9f3;
    --good:          #006300;
    --bad:           #b42323;
    --focus-ring:     #2a78d6;
    --shadow: 0 1px 2px rgba(23,20,15,0.04), 0 8px 24px rgba(23,20,15,0.06);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 28px 96px;
  }

  /* ---------- Masthead ---------- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .eyebrow {
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 {
    font-family: "Archivo", sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .as-of {
    text-align: right;
    color: var(--ink-secondary);
    font-size: 13px;
    line-height: 1.5;
  }
  .as-of strong { color: var(--ink); font-weight: 600; }

  .masthead-right {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .theme-toggle {
    appearance: none;
    cursor: pointer;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-secondary);
    flex-shrink: 0;
    transition: color .15s ease, border-color .15s ease;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--baseline); }
  .theme-toggle:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .theme-toggle svg { width: 17px; height: 17px; display: block; }
  /* JS sets data-mode="light"|"dark" to the CURRENT effective theme; the
     icon shown is the mode a click would switch TO. */
  .theme-toggle .icon-sun, .theme-toggle .icon-moon { display: none; }
  .theme-toggle[data-mode="dark"] .icon-sun { display: block; }
  .theme-toggle[data-mode="light"] .icon-moon { display: block; }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 28px;
    overflow-x: auto;
  }
  .tab {
    appearance: none;
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--ink-muted);
    padding: 12px 18px 13px;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab:hover { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .tab[aria-selected="true"] {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
  .tab .count {
    font-family: "Public Sans", sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink-muted);
    background: var(--surface-alt);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .tab[aria-selected="true"] .count { color: var(--accent-ink); background: var(--accent-tint); }

  /* ---------- Stat row ---------- */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(var(--stat-cols, 3), 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 18px 20px;
  }
  .stat-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-secondary);
    margin: 0 0 8px;
  }
  .stat-value-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stat-value {
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .stat-delta {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat-delta.is-up { color: var(--good); }
  .stat-delta.is-down { color: var(--bad); }
  .stat-delta.is-flat { color: var(--ink-muted); font-weight: 500; }
  .stat-sub {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin: 8px 0 0;
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 22px 22px 18px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .card-title {
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 4px;
  }
  .card-subtitle {
    font-size: 12.5px;
    color: var(--ink-muted);
    margin: 0;
  }

  /* ---------- Section heading (divider between merged sections within one tab) ---------- */
  .content-section-heading {
    margin: 32px 0 18px;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
  }
  .content-section-title {
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 0 0 4px;
  }
  .content-section-subtitle {
    font-size: 13px;
    color: var(--ink-muted);
    margin: 0;
  }

  /* ---------- Highlights ---------- */
  .highlights-card { padding-bottom: 18px; }
  .highlight-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .highlight-item {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .highlight-dot {
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateY(-1px);
  }
  .highlight-dot.is-up { background: var(--good); }
  .highlight-dot.is-down { background: var(--bad); }
  .highlight-dot.is-new { background: var(--series); }
  .highlight-dot.is-soon { background: var(--accent); }
  .highlight-text strong { font-weight: 600; }
  .highlight-empty { color: var(--ink-muted); font-size: 13.5px; }

  /* ---------- Legend ---------- */
  .legend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 14px;
  }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-secondary);
    font-weight: 600;
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .legend-dot.is-series { background: var(--series); }
  .legend-dot.is-accent { background: var(--accent); }

  /* ---------- Center filter ---------- */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-secondary);
  }
  .center-filter { position: relative; }
  .center-filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .center-filter-btn:hover { border-color: var(--baseline); }
  .center-filter-btn .chev { font-size: 10px; color: var(--ink-muted); }
  .center-filter-panel {
    position: absolute;
    z-index: 20;
    top: calc(100% + 6px);
    left: 0;
    width: 280px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 12px;
  }
  .center-filter-search {
    width: 100%;
    box-sizing: border-box;
    font: inherit;
    font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--hairline);
    border-radius: 5px;
    background: var(--ground);
    color: var(--ink);
    margin-bottom: 8px;
  }
  .center-filter-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .center-filter-actions button {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--series);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .center-filter-actions button:hover { text-decoration: underline; }
  .center-filter-list {
    max-height: 240px;
    overflow-y: auto;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding: 6px 0;
    margin-bottom: 10px;
  }
  .center-filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 5px 2px;
    cursor: pointer;
    border-radius: 4px;
  }
  .center-filter-item:hover { background: var(--surface-alt); }
  .center-filter-item input { flex-shrink: 0; }
  .center-filter-empty { font-size: 12.5px; color: var(--ink-muted); padding: 8px 2px; }
  .center-filter-divider { height: 1px; background: var(--hairline); margin: 6px 2px; }
  .center-filter-apply {
    width: 100%;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent-tint);
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 8px;
    cursor: pointer;
  }
  .center-filter-apply:hover { opacity: 0.85; }

  /* ---------- Window compare (Visits) ---------- */
  .compare-windows {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .compare-window {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 240px;
  }
  .compare-window-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .compare-window-label .swatch {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    display: inline-block;
  }
  .compare-window-label .swatch.is-a { background: var(--series); }
  .compare-window-label .swatch.is-b { background: var(--accent); }
  .compare-date-inputs {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .compare-date-inputs > span {
    font-size: 12.5px;
    color: var(--ink-muted);
  }
  /* Native <input type="date"> renders its text in the browser's own locale
     order (day-first in many locales). To guarantee month-first display
     everywhere regardless of the visitor's locale, the native input is kept
     fully functional (focusable, opens the calendar picker) but visually
     transparent, stacked under a display box we format ourselves. */
  .date-field {
    position: relative;
    display: inline-flex;
  }
  .date-field-native {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }
  .date-field-display {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--ground);
    border: 1px solid var(--hairline);
    border-radius: 5px;
    padding: 7px 9px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    pointer-events: none;
  }
  .date-field-icon {
    display: inline-flex;
    width: 13px;
    height: 13px;
    color: var(--ink-muted);
    flex: none;
  }
  .date-field-icon svg { width: 100%; height: 100%; }
  .date-field-native:focus + .date-field-display {
    outline: 2px solid var(--series);
    outline-offset: 1px;
  }
  .compare-vs {
    align-self: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-muted);
    padding-bottom: 9px;
  }
  .compare-window-days {
    font-size: 12px;
    color: var(--ink-muted);
  }
  .compare-section-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-secondary);
    margin: 4px 0 10px;
  }

  /* ---------- Insight grid (business insights) ---------- */
  .insight-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 900px) {
    .insight-grid { grid-template-columns: 1fr; }
  }
  .insight-card {
    background: var(--surface-alt);
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--ink-muted);
    border-radius: 6px;
    padding: 16px 18px;
  }
  .insight-card.is-down { border-left-color: var(--bad); }
  .insight-card.is-up { border-left-color: var(--good); }
  .insight-card.is-new { border-left-color: var(--series); }
  .insight-card.is-soon { border-left-color: var(--accent); }
  .insight-tag {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 0 8px;
  }
  .insight-headline {
    font-family: "Archivo", sans-serif;
    font-weight: 700;
    font-size: 18px;
    margin: 0 0 8px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .insight-headline-sub {
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-secondary);
  }
  .insight-body {
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-secondary);
    margin: 0;
  }
  .insight-body strong { color: var(--ink); font-weight: 600; }

  /* ---------- Two-up chart grid ---------- */
  .chart-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) {
    .chart-grid-2 { grid-template-columns: 1fr; }
  }
  .chart-grid-2 .chart-sub-card .card-title { font-size: 14px; }

  /* ---------- Chart ---------- */
  .chart-wrap { position: relative; }
  .chart-svg { width: 100%; height: 220px; display: block; overflow: visible; }
  .bar { fill: var(--series); cursor: pointer; }
  .bar:hover, .bar.hovered { fill: var(--series); opacity: 0.82; }
  .bar.accent { fill: var(--accent); }
  .bar.accent:hover, .bar.accent.hovered { fill: var(--accent); opacity: 0.82; }
  .gridline { stroke: var(--hairline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .axis-label { fill: var(--ink-muted); font-size: 10.5px; font-family: "Public Sans", sans-serif; }
  .ytick-label { fill: var(--ink-muted); font-size: 10.5px; font-family: "Public Sans", sans-serif; font-variant-numeric: tabular-nums; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--ink);
    color: var(--ground);
    font-size: 12px;
    line-height: 1.4;
    border-radius: 5px;
    padding: 7px 10px;
    transform: translate(-50%, -100%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity .1s ease;
    z-index: 5;
    box-shadow: var(--shadow);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip .tt-value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tooltip .tt-label { color: var(--ink-muted); }

  details.table-toggle { margin-top: 12px; }
  details.table-toggle summary {
    font-size: 12.5px;
    color: var(--ink-secondary);
    cursor: pointer;
    font-weight: 600;
  }
  .weekly-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
  .weekly-table th, .weekly-table td { text-align: left; padding: 5px 10px 5px 0; border-bottom: 1px solid var(--hairline); font-variant-numeric: tabular-nums; }
  .weekly-table th { color: var(--ink-muted); font-weight: 600; }

  /* ---------- Table ---------- */
  .table-scroll { overflow-x: auto; overflow-y: auto; max-height: 620px; }
  table.programs {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.programs th {
    text-align: left;
    font-family: "Public Sans", sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 0 12px 10px 0;
    border-bottom: 1px solid var(--hairline);
    white-space: nowrap;
    position: sticky;
    top: 0;
    background: var(--surface);
    padding-top: 8px;
    z-index: 1;
  }
  table.programs th button {
    appearance: none;
    background: none;
    border: none;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0;
  }
  table.programs th button:hover { color: var(--ink); }
  table.programs th button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .sort-arrow { font-size: 9px; opacity: 0.5; }
  .sort-arrow.active { opacity: 1; color: var(--accent); }
  table.programs td {
    padding: 10px 12px 10px 0;
    border-bottom: 1px solid var(--hairline);
    color: var(--ink);
    vertical-align: top;
  }
  table.programs tbody tr:last-child td { border-bottom: none; }
  table.programs tr.total-row td {
    font-weight: 700;
    background: var(--surface-alt);
    border-bottom: 2px solid var(--baseline);
  }

  //      holds data (standalone page, file://; filled by update_page_data.py);
  //   2. otherwise window.DASHBOARD_REPORT_URLS[<block>], if the hosting page set
  //      it before this script ran (e.g. short-lived S3 links from the admin app),
  //      fetched at startup — each tab re-renders when its report arrives.
  // Add a tab here as it is converted.
  var REPORT_BLOCKS = {

    programs: "dash-programs-data",
    app: "app-dashboard-data",
    meditators: "dash-meditators-data",
    future_meditators: "dash-future-meditators-data",
    visits: "dash-visits-data",
    msr: "dash-msr-data"

  // IEO tab from the `ieo_dashboard` export (progress, languages, completionsMonthly,
  // completionsWeekly): computes the figures renderIeoTab draws.
  // Differences from the old hand export, all deliberate:
  //   * North America IEO platform only (the old export counted every region);
  //   * weeks are Monday–Sunday; counts under 5 are merged into "(other) — <region>"
  //     and anything still below 5 is dropped (report.provenance.suppressedBelowK);
  //   * "Active mid-step" is status Active only.
  function ieoView(report) {
    "use strict";
    var STEPS = ["1", "2", "3", "4", "5", "6", "7"];

    // '(other)' exists once per region; give each its own name so the centre
    // filter can tell them apart.

    // 'Out of North America', so use that name or it would be included by default.
    function centreName(row) {

      return row.centerName === "(other)" ? "(other) — " + row.centerRegion : row.centerName;
    }

    var byCentre = {}, funnelByCentre = {};
    report.progress.forEach(function (r) {
      var c = centreName(r), n = r.participants;
      inc(byCentre, c, "total", n);
      if (r.status === "Completed") inc(byCentre, c, "completed", n);
      if (r.status === "Expired") inc(byCentre, c, "expired", n);
      if (r.status === "Active") inc(byCentre, c, "active_step", n);
      var m = /^Step (\d)$/.exec(r.stage);
      if (m && r.status !== "Completed") {

        var fk = c + "\u0000" + m[1];
        if (r.status === "Expired") inc(funnelByCentre, fk, "expired", n);
        if (r.status === "Active") inc(funnelByCentre, fk, "in_progress", n);
      }
    });

    var centers = [], stepsByCenter = [];
    var tot = { total: 0, completed: 0, expired: 0, active_step: 0 };
    Object.keys(byCentre).forEach(function (c) {
      var v = byCentre[c];
      var row = { center: c, total: v.total || 0, completed: v.completed || 0,
                  expired: v.expired || 0, active_step: v.active_step || 0 };
      row.completion_rate = pct(row.completed, row.total);
      centers.push(row);
      var s = { center: c, completed: row.completed, total: row.total };
      STEPS.forEach(function (k) { s["s" + k] = v["s" + k] || 0; });
      stepsByCenter.push(s);
      Object.keys(tot).forEach(function (k) { tot[k] += row[k]; });
    });
    centers.sort(function (a, b) { return b.total - a.total || (a.center < b.center ? -1 : 1); });
    stepsByCenter.sort(function (a, b) { return b.total - a.total || (a.center < b.center ? -1 : 1); });

    var funnelRecords = Object.keys(funnelByCentre).map(function (fk) {
      var parts = fk.split("\u0000"), v = funnelByCentre[fk];

    });

      var e = 0, a = 0;
      funnelRecords.forEach(function (r) { if (r.s === s) { e += r.expired; a += r.in_progress; } });
      return { step: s, expired: e, in_progress: a };
    });

    // ---- languages ----
    var langTotals = {}, langByCentre = [];
    report.languages.forEach(function (r) {
      langTotals[r.language] = (langTotals[r.language] || 0) + r.participants;
      langByCentre.push({ c: centreName(r), lang: r.language, n: r.participants });
    });
    var langSum = Object.keys(langTotals).reduce(function (a, k) { return a + langTotals[k]; }, 0);
    var languages = Object.keys(langTotals)
      .map(function (l) { return { lang: l, count: langTotals[l], pct: pct(langTotals[l], langSum) }; })
      .sort(function (a, b) { return b.count - a.count || (a.lang < b.lang ? -1 : 1); });

    // ---- completions by month / year ----
    var mb = report.provenance.windowBounds.completionsMonthly;
    var months = [];
    for (var d = new Date(mb.start + "T00:00:00Z"); d.toISOString().slice(0, 10) < mb.end;

    // ---- completions by week (zero-filled from the window: an absent week is a
    //      week with no Sunday batch, not missing data) ----
    var wb = report.provenance.windowBounds.completionsWeekly;
    var weekTotals = {}, weeks = [];
    for (var w = new Date(wb.start + "T00:00:00Z"); w.toISOString().slice(0, 10) < wb.end;
         w.setUTCDate(w.getUTCDate() + 7)) {
      var ws = w.toISOString().slice(0, 10);
      var we = new Date(w.getTime() + 6 * 864e5).toISOString().slice(0, 10);
      weeks.push({ start: ws, end: we }); weekTotals[ws] = 0;
    }
    var weeklyByCenter = report.completionsWeekly.map(function (r) {
      weekTotals[r.weekStart] = (weekTotals[r.weekStart] || 0) + r.completions;
      return { c: centreName(r), w: r.weekStart, n: r.completions };
    });
    var weeklyRecent = weeks.map(function (x) { return { start: x.start, end: x.end, count: weekTotals[x.start] }; });

    function last(a, i) { return a.length > i ? a[a.length - 1 - i].count : 0; }
    return {
      total_records: tot.total,
      completed: tot.completed,
      completion_rate: pct(tot.completed, tot.total),
      total_expired: tot.expired,
      total_active_step: tot.active_step,
      funnel: funnel,
      funnel_by_center: funnelRecords,
      languages: languages,
      languages_by_center: langByCentre,
      centers: centers,
      steps_by_center: stepsByCenter,
      completions_undated: 0,               // every warehouse completion is dated
      completions_latest_date: null,        // not published; use provenance.generatedAt for freshness
      yearly: yearly,
      monthly_last12: last12,
      weekly_recent: weeklyRecent,
      monthly_by_center: monthlyByCenter,
      weekly_by_center: weeklyByCenter,
      this_month: last(last12, 0), prev_month: last(last12, 1), delta_month: last(last12, 0) - last(last12, 1),
      this_week: last(weeklyRecent, 0), prev_week: last(weeklyRecent, 1), delta_week: last(weeklyRecent, 0) - last(weeklyRecent, 1),
      // Extra, for a "data as of / suppressed" note on the tab.
      generated_at: report.provenance.generatedAt,
      suppressed_below_k: report.provenance.suppressedBelowK
    };
  }

  // App tabs (Sadhguru App, Miracle of Mind App) from the `app_dashboard` export:
  //   downloadsDaily[]   — day × app × countryGroup: downloads
  //   downloadsAllTime[] — app: downloads, firstDay
  // MOM = the complete MoM sign-up feed; Sadhguru App = Salesforce-linked installs only
  // (a lower bound). Minutes meditated, 7-min completions and the OS split have no
  // warehouse source, so they are null and the tab shows a note instead.
  // Weeks are Monday–Sunday and only COMPLETE weeks are kept.
  function appView(report) {
    var GROUPS = ["US", "Canada", "LATAM", "Other"];       // Unknown folds into Other
    function emptyRow() { var r = { total: 0 }; GROUPS.forEach(function (g) { r[g] = 0; }); return r; }
    function addTo(row, group, n) {
      var g = group === "Unknown" ? "Other" : group;
      row[g] = (row[g] || 0) + n;
      row.total += n;
    }
    function iso(d) { return d.toISOString().slice(0, 10); }
    var wb = report.provenance.windowBounds.downloadsDaily;
    var firstMon = new Date(wb.start + "T00:00:00Z");
    while (firstMon.getUTCDay() !== 1) firstMon.setUTCDate(firstMon.getUTCDate() + 1);
    var lastSun = new Date(wb.end + "T00:00:00Z"); lastSun.setUTCDate(lastSun.getUTCDate() - 1);
    while (lastSun.getUTCDay() !== 0) lastSun.setUTCDate(lastSun.getUTCDate() - 1);
    var minDate = iso(firstMon), maxDate = iso(lastSun);

    function metricFor(app) {
      var byDay = {};
      report.downloadsDaily.forEach(function (r) {
        if (r.app !== app || r.day < minDate || r.day > maxDate) return;
        byDay[r.day] = byDay[r.day] || emptyRow();
        addTo(byDay[r.day], r.countryGroup, r.downloads);
      });
      var daily = [], weekly = [];
      for (var d = new Date(firstMon); iso(d) <= maxDate; d.setUTCDate(d.getUTCDate() + 1)) {
        var day = iso(d), row = byDay[day] || emptyRow();
        var out = { date: day, total: row.total };
        GROUPS.forEach(function (g) { out[g] = row[g]; });
        daily.push(out);
        if (d.getUTCDay() === 1) {
          var end = new Date(d); end.setUTCDate(end.getUTCDate() + 6);
          weekly.push(Object.assign({ start: day, end: iso(end) }, emptyRow()));
        }
        var w = weekly[weekly.length - 1];
        GROUPS.forEach(function (g) { w[g] += out[g]; });
        w.total += out.total;
      }
      return { min_date: minDate, max_date: maxDate, daily: daily, weekly: weekly };
    }

    var allTime = {}, firstDay = {};
    report.downloadsAllTime.forEach(function (r) { allTime[r.app] = r.downloads; firstDay[r.app] = r.firstDay; });
    return {
      countries: GROUPS,
      all_time_global: {
        mom_downloads: allTime["Miracle of Mind"] || 0,
        sadhguru_downloads: allTime["Sadhguru App"] || 0,
        minutes_meditated: null,
        completions_7min: null
      },
      all_time_sub: {
        mom: "warehouse · every MoM user since " + firstDay["Miracle of Mind"] + " · all countries",
        sadhguru: "warehouse · Salesforce-linked installs since " + firstDay["Sadhguru App"] + " · lower bound"
      },
      metrics: {
        mom_downloads: metricFor("Miracle of Mind"),
        sadhguru_downloads: metricFor("Sadhguru App"),
        minutes_meditated: null,
        completions_7min: null
      },
      os_split: null
    };
  }

  // Meditators and Future Meditators tabs from the `dash_meditators` / `dash_future_meditators`
  // exports. Weeks are Monday–Sunday, complete weeks only; months "YYYY-MM"; "(other)" is the
  // k=5 privacy floor.
  function _dashMonth(d) { return d.slice(0, 7); }
  function _dashIso(d) { return d.toISOString().slice(0, 10); }
  function _dashPct(a, b) { return b ? Math.round(1000 * a / b) / 10 : 0; }
  function _dashWeeks(bounds) {
    var out = [];
    for (var d = new Date(bounds.start + "T00:00:00Z"); _dashIso(d) < bounds.end; d.setUTCDate(d.getUTCDate() + 7)) {
      var e = new Date(d.getTime() + 6 * 864e5);
      out.push({ start: _dashIso(d), end: _dashIso(e) });
    }
    return out;
  }
  function _dashLastMonths(endMonth, n) {
    var y = +endMonth.slice(0, 4), m = +endMonth.slice(5, 7), out = [];
    for (var i = n - 1; i >= 0; i--) {
      var mm = m - i, yy = y;
      while (mm < 1) { mm += 12; yy -= 1; }
      out.push(yy + "-" + (mm < 10 ? "0" : "") + mm);
    }
    return out;
  }

  function meditatorsView(report) {
    "use strict";
    var p = report.provenance;
    var nowMonth = p.generatedAt.slice(0, 7);
    var t = report.totals[0];

    var monthlyByCenter = report.initiationsMonthly.map(function (r) {
      return { c: r.centerName, m: _dashMonth(r.month), n: r.initiations };
    });
    var byMonth = {}, byYear = {};
    monthlyByCenter.forEach(function (r) {
      byMonth[r.m] = (byMonth[r.m] || 0) + r.n;
      var y = r.m.slice(0, 4);
      byYear[y] = (byYear[y] || 0) + r.n;
    });
    var yearly = Object.keys(byYear).sort().map(function (y) { return { year: y, count: byYear[y] }; });
    var last12 = _dashLastMonths(nowMonth, 12).map(function (m) { return { month: m, count: byMonth[m] || 0 }; });

    var weeks = _dashWeeks(p.windowBounds.initiationsWeekly);
    var byWeek = {};
    var weeklyByCenter = report.initiationsWeekly.map(function (r) {
      byWeek[r.weekStart] = (byWeek[r.weekStart] || 0) + r.initiations;
      return { c: r.centerName, w: r.weekStart, n: r.initiations };
    });
    var weeklyRecent = weeks.map(function (w) { return { start: w.start, end: w.end, count: byWeek[w.start] || 0 }; });

    var last12Set = {}; last12.forEach(function (x) { last12Set[x.month] = true; });
    var cTot = {}, c12 = {};
    monthlyByCenter.forEach(function (r) {
      cTot[r.c] = (cTot[r.c] || 0) + r.n;
      if (last12Set[r.m]) c12[r.c] = (c12[r.c] || 0) + r.n;
    });
    var datedSum = Object.keys(cTot).reduce(function (a, c) { return a + cTot[c]; }, 0);
    var centers = Object.keys(cTot).map(function (c) {
      return { center: c, total: cTot[c], last12mo: c12[c] || 0, pct_of_total: _dashPct(cTot[c], datedSum) };
    }).sort(function (a, b) { return b.total - a.total || (a.center < b.center ? -1 : 1); });

    var order = ["1", "2", "3", "4+"], fb = {};
    report.membersByEventCount.forEach(function (r) { fb[r.events] = r.members; });
    var frequency = order.map(function (k) { return { label: k, count: fb[k] || 0 }; });

    function lastN(a, i) { return a.length > i ? a[a.length - 1 - i].count : 0; }
    return {
      total_initiations_alltime: t.datedInitiations,
      undated_count: t.undatedInitiations,
      excluded_placeholder: t.placeholderInitiations,
      latest_valid_date: t.latestValidDate,
      yearly: yearly,
      monthly_last12: last12,
      weekly_recent: weeklyRecent,
      monthly_by_center: monthlyByCenter,
      weekly_by_center: weeklyByCenter,
      this_month: lastN(last12, 0), prev_month: lastN(last12, 1), delta_month: lastN(last12, 0) - lastN(last12, 1),
      this_week: lastN(weeklyRecent, 0), prev_week: lastN(weeklyRecent, 1), delta_week: lastN(weeklyRecent, 0) - lastN(weeklyRecent, 1),
      centers: centers,
      frequency_buckets: frequency,
      total_members_tracked: t.members,
      pct_one_time: _dashPct(fb["1"] || 0, t.members),
      generated_at: p.generatedAt,
      suppressed_below_k: p.suppressedBelowK
    };
  }

  function futureMeditatorsView(report) {
    "use strict";
    var p = report.provenance;
    var t = report.totals[0];

    var byMonth = {}, cL = {}, cI = {};
    var monthlyByCenter = report.leadsMonthly.map(function (r) {
      var m = _dashMonth(r.month);
      byMonth[m] = byMonth[m] || { leads: 0, ie: 0 };
      byMonth[m].leads += r.leads; byMonth[m].ie += r.ieRegistered;
      cL[r.centerName] = (cL[r.centerName] || 0) + r.leads;
      cI[r.centerName] = (cI[r.centerName] || 0) + r.ieRegistered;
      return { c: r.centerName, m: m, l: r.leads, i: r.ieRegistered };
    });
    // contiguous months from the first lead month to the last
    var monthsSorted = Object.keys(byMonth).sort(), monthly = [];
    if (monthsSorted.length) {
      var all = _dashLastMonths(monthsSorted[monthsSorted.length - 1], 1000);
      all.filter(function (m) { return m >= monthsSorted[0]; }).forEach(function (m) {
        var v = byMonth[m] || { leads: 0, ie: 0 };
        monthly.push({ month: m, leads: v.leads, ie: v.ie });
      });
    }

    var weeks = _dashWeeks(p.windowBounds.leadsWeekly);
    var wL = {}, wI = {};
    var weeklyByCenter = report.leadsWeekly.map(function (r) {
      wL[r.weekStart] = (wL[r.weekStart] || 0) + r.leads;
      wI[r.weekStart] = (wI[r.weekStart] || 0) + r.ieRegistered;
      return { c: r.centerName, w: r.weekStart, l: r.leads, i: r.ieRegistered };
    });
    var weeklyLeads = weeks.map(function (w) { return { start: w.start, end: w.end, count: wL[w.start] || 0 }; });
    var weeklyIe = weeks.map(function (w) { return { start: w.start, end: w.end, count: wI[w.start] || 0 }; });

    var centers = Object.keys(cL).map(function (c) {
      return { center: c, leads: cL[c], ie: cI[c], conversion: _dashPct(cI[c], cL[c]) };
    }).sort(function (a, b) { return b.leads - a.leads || (a.center < b.center ? -1 : 1); });

    function lastN(a, i) { return a.length > i ? a[a.length - 1 - i].count : 0; }
    return {
      min_date: t.minDate,
      max_date: t.maxDate,
      total_leads: t.leads,
      total_ie_registered: t.ieRegistered,
      conversion_rate: _dashPct(t.ieRegistered, t.leads),
      monthly: monthly,
      weekly_leads: weeklyLeads,
      weekly_ie_reg: weeklyIe,
      monthly_by_center: monthlyByCenter,
      weekly_by_center: weeklyByCenter,
      this_week_leads: lastN(weeklyLeads, 0), prev_week_leads: lastN(weeklyLeads, 1),
      delta_leads: lastN(weeklyLeads, 0) - lastN(weeklyLeads, 1),
      this_week_ie_reg: lastN(weeklyIe, 0), prev_week_ie_reg: lastN(weeklyIe, 1),
      delta_ie_reg: lastN(weeklyIe, 0) - lastN(weeklyIe, 1),
      centers: centers,
      generated_at: p.generatedAt,
      suppressed_below_k: p.suppressedBelowK
    };
  }

  // Visitor sections (iiis / IYCLA tabs) from the `dash_visits` export.
  //
  // Differences from the hand export, all deliberate (see dash_visits.yml):
  //   * weeks are Monday–Sunday; "this week" is the week containing `today` (the
  //     export's generation date), "this month" the month containing it — partial
  //     periods, like the hand export, which also counts booked future arrivals;
  //   * a 7th stay bucket "Not recorded" (stay length missing) — the hand export has
  //     no such bucket; the page reads buckets from days_cat_defs, so it just appears;
  //   * daily_by_satsang is MONTHLY: each row is dated the 1st of its month, so the
  //     "visitors by sathsang center" tool sums whole months, and centres with < 5
  //     bookings in a month appear as "(other)";
  //   * corrupted_values_excluded has no warehouse equivalent (null); undated /
  //     placeholder counts exist only overall, so per-site values are null.
  function visitsView(report) {
    "use strict";
    var TYPES = ["program", "overnight", "day", "volunteer"];
    var TYPE_LABEL = { program: "Program visit", overnight: "Overnight visit", day: "Day visit", volunteer: "Volunteering" };
    var STAYS = [
      { key: "stay_0", src: "stay0", category: "0", label: "Day visit (0 nights)" },
      { key: "stay_1_2", src: "stay12", category: "1-2", label: "1–2 nights" },
      { key: "stay_3_5", src: "stay35", category: "3-5", label: "3–5 nights" },
      { key: "stay_6_7", src: "stay67", category: "6-7", label: "6–7 nights" },
      { key: "stay_8_14", src: "stay814", category: "8-14", label: "8–14 nights" },
      { key: "stay_15p", src: "stay15p", category: "15+", label: "15+ nights" },
      { key: "stay_unrec", src: "stayUnrec", category: "n/r", label: "Not recorded" }
    ];
    var today = report.provenance.generatedAt.slice(0, 10);
    var meta = (report.meta && report.meta[0]) || {};

    function iso(d) { return d.toISOString().slice(0, 10); }
    function mondayOf(s) { var d = new Date(s + "T00:00:00Z"); var k = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - k); return iso(d); }
    function addDaysIso(s, n) { var d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); }

    function dayRow(r) {
      var o = { date: r.visitDate, adults: r.adults, children: r.children };
      TYPES.forEach(function (t) { o[t + "_adults"] = r[t + "Adults"] || 0; o[t + "_children"] = r[t + "Children"] || 0; });
      STAYS.forEach(function (s) { o[s.key + "_adults"] = r[s.src + "Adults"] || 0; o[s.key + "_children"] = r[s.src + "Children"] || 0; });
      return o;
    }

    function section(rows, withMeta) {
      var daily = rows.map(dayRow).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      // a date can appear once per site; merge (only matters for the combined section)
      var merged = [];
      daily.forEach(function (d) {
        var last = merged[merged.length - 1];
        if (last && last.date === d.date) { Object.keys(d).forEach(function (k) { if (k !== "date") last[k] += d[k]; }); }
        else merged.push(Object.assign({}, d));
      });
      daily = merged;

      var tot = { adults: 0, children: 0 }, typeTot = {}, stayTot = {}, years = {}, months = {}, weeks = {};
      TYPES.forEach(function (t) { typeTot[t] = { adults: 0, children: 0 }; });
      STAYS.forEach(function (s) { stayTot[s.key] = { adults: 0, children: 0 }; });
      daily.forEach(function (d) {
        tot.adults += d.adults; tot.children += d.children;
        TYPES.forEach(function (t) { typeTot[t].adults += d[t + "_adults"]; typeTot[t].children += d[t + "_children"]; });
        STAYS.forEach(function (s) { stayTot[s.key].adults += d[s.key + "_adults"]; stayTot[s.key].children += d[s.key + "_children"]; });
        var y = d.date.slice(0, 4), m = d.date.slice(0, 7), w = mondayOf(d.date);
        years[y] = years[y] || { adults: 0, children: 0 }; years[y].adults += d.adults; years[y].children += d.children;
        months[m] = months[m] || { adults: 0, children: 0 }; months[m].adults += d.adults; months[m].children += d.children;
        if (!weeks[w]) { weeks[w] = { adults: 0, children: 0 }; TYPES.forEach(function (t) { weeks[w][t + "_adults"] = 0; weeks[w][t + "_children"] = 0; }); STAYS.forEach(function (s) { weeks[w][s.key + "_adults"] = 0; weeks[w][s.key + "_children"] = 0; }); }
        Object.keys(weeks[w]).forEach(function (k) { weeks[w][k] += d[k]; });
      });
      var people = tot.adults + tot.children;
      var visitTypes = TYPES.map(function (t) {
        var total = typeTot[t].adults + typeTot[t].children;
        return { type: TYPE_LABEL[t], adults: typeTot[t].adults, children: typeTot[t].children, total: total, pct: people ? Math.round(1000 * total / people) / 10 : 0 };
      }).sort(function (a, b) { return b.total - a.total; });

      // last 12 months ending with today's month; last 15 weeks ending with today's week
      var monthsList = [], cur = new Date(today.slice(0, 7) + "-01T00:00:00Z");
      for (var i = 11; i >= 0; i--) { var dm = new Date(cur); dm.setUTCMonth(dm.getUTCMonth() - i); monthsList.push(iso(dm).slice(0, 7)); }
      var thisMon = mondayOf(today), weekList = [];
      for (var j = 14; j >= 0; j--) weekList.push(addDaysIso(thisMon, -7 * j));
      function wk(w) { return weeks[w] || null; }
      var weeklyRecent = weekList.map(function (w) { var x = wk(w); return { start: w, end: addDaysIso(w, 6), adults: x ? x.adults : 0, children: x ? x.children : 0 }; });
      var weeklyByType = weekList.map(function (w) { var x = wk(w), o = { start: w, end: addDaysIso(w, 6) }; TYPES.forEach(function (t) { o[t + "_adults"] = x ? x[t + "_adults"] : 0; o[t + "_children"] = x ? x[t + "_children"] : 0; }); return o; });
      var weeklyByStay = weekList.map(function (w) { var x = wk(w), o = { start: w, end: addDaysIso(w, 6) }; STAYS.forEach(function (s) { o[s.key + "_adults"] = x ? x[s.key + "_adults"] : 0; o[s.key + "_children"] = x ? x[s.key + "_children"] : 0; }); return o; });
      var monthly = monthsList.map(function (m) { var x = months[m]; return { month: m, adults: x ? x.adults : 0, children: x ? x.children : 0 }; });
      var tm = monthly[11], pm = monthly[10], tw = weeklyRecent[14], pw = weeklyRecent[13];

      return {
        today: today,
        min_date: daily.length ? daily[0].date : null,
        max_date: daily.length ? daily[daily.length - 1].date : null,
        total_adults: tot.adults, total_children: tot.children,
        undated_rows: withMeta ? meta.undatedRows : null,
        excluded_placeholder_rows: withMeta ? meta.excludedPlaceholderRows : null,
        corrupted_values_excluded: null,
        visit_types: visitTypes,
        days_categories: STAYS.map(function (s) { return { category: s.category, label: s.label, adults: stayTot[s.key].adults, children: stayTot[s.key].children }; }),
        days_cat_defs: STAYS.map(function (s) { return { key: s.key, label: s.label }; }),
        yearly: Object.keys(years).sort().map(function (y) { return { year: y, adults: years[y].adults, children: years[y].children }; }),
        monthly_last12: monthly,
        weekly_recent: weeklyRecent,
        weekly_by_type: weeklyByType,
        weekly_by_stay: weeklyByStay,
        this_month_adults: tm.adults, prev_month_adults: pm.adults, delta_month_adults: tm.adults - pm.adults,
        this_month_children: tm.children, prev_month_children: pm.children, delta_month_children: tm.children - pm.children,
        this_week_adults: tw.adults, prev_week_adults: pw.adults, delta_week_adults: tw.adults - pw.adults,
        this_week_children: tw.children, prev_week_children: pw.children, delta_week_children: tw.children - pw.children,
        daily: daily
      };
    }

    var all = section(report.daily, true);
    all.by_center = {
      iii: section(report.daily.filter(function (r) { return r.site === "iii"; }), false),
      LA: section(report.daily.filter(function (r) { return r.site === "LA"; }), false)
    };
    all.centers = ["iii", "LA"];
    var satTot = {};
    all.daily_by_satsang = report.satsangMonthly.map(function (r) {
      satTot[r.satsangCenter] = (satTot[r.satsangCenter] || 0) + r.adults + r.children;
      return [r.month, r.satsangCenter, r.adults, r.children];
    }).sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; });
    all.satsang_centers = Object.keys(satTot).sort(function (a, b) { return satTot[b] - satTot[a]; });
    return all;
  }

  // MSR analytics tab from the `dash_msr` export.
  //
  // Differences from the old hand-built MSR data, all deliberate:
  //   * centres with fewer than 5 people in a cell are merged into "(other)" — it
  //     appears as one more centre in the filter and still counts in every total;
  //   * cohort2.s can be "pooled" (a small centre's classes merged), which the
  //     "where non-finishers stopped" chart does not plot but still counts;
  //   * hist.x (registrations per person) is not published: x is null;
  //   * people_excluded_ona / regs_excluded_ona are 0, as on the page (Out of North
  //     America is kept and filtered client-side).
  function msrView(report) {
    "use strict";
    var CATEGORIES = [
      { key: "shambhavi_support", label: "Shambhavi practice support" },
      { key: "ie", label: "Inner Engineering (in-person & retreats)" },
      { key: "ie_online", label: "Inner Engineering Online" },
      { key: "hatha", label: "Hatha Yoga" },
      { key: "advanced", label: "Advanced programs" },
      { key: "free_program", label: "Free & introductory programs" },
      { key: "sadhguru_events", label: "Sadhguru events & festivals" },
      { key: "satsang", label: "Satsangs" },
      { key: "gathering_satsang", label: "Gatherings" },
      { key: "online_sadhana", label: "Online sadhanas" },

    ];
    var S = report.summary[0];

      types: report.types.map(function (r) { return { c: r.c, i: r.i, tk: r.tk, k: r.k, p: r.p, n: r.n, r: r.r }; }),
      hist: report.hist.map(function (r) { return { c: r.c, i: r.i, tk: r.tk, t: r.t, x: null, n: r.n }; }),

      retaker_rule: "Registered for Inner Engineering, Advanced programs or Satsangs before MSR",

  // ---------- Weekly chart ----------
  function buildChart(weekly, opts) {
    opts = opts || {};
    var unitLabel = opts.unitLabel || "registrations";
    var ariaLabel = opts.ariaLabel || ("Weekly " + unitLabel + " bar chart");
    var colorClass = opts.colorClass || "";
    var xLabelFmt = opts.xLabelFmt || function (w) { return fmtDateShort(w.start); };

    var wrap = document.createElement("div");
    wrap.className = "chart-wrap";

    var svgNS = "http://www.w3.org/2000/svg";
    var W = 1000, H = 220;
    var padL = 34, padR = 6, padT = 10, padB = 26;
    var plotW = W - padL - padR;
    var plotH = H - padT - padB;

    var maxVal = 0;
    weekly.forEach(function (w) { if (w.count > maxVal) maxVal = w.count; });
    var niceMax = niceCeil(maxVal);

    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("class", "chart-svg");
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", ariaLabel);

    // gridlines + y ticks (0, mid, max)
    var ticks = [0, niceMax / 2, niceMax];
    ticks.forEach(function (tickVal) {
      var y = padT + plotH - (tickVal / (niceMax || 1)) * plotH;
      var line = document.createElementNS(svgNS, "line");
      line.setAttribute("x1", padL);
      line.setAttribute("x2", W - padR);
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      line.setAttribute("class", tickVal === 0 ? "baseline" : "gridline");
      svg.appendChild(line);

      var label = document.createElementNS(svgNS, "text");
      label.setAttribute("x", padL - 8);
      label.setAttribute("y", y + 3.5);
      label.setAttribute("text-anchor", "end");
      label.setAttribute("class", "ytick-label");
      label.textContent = fmtInt(Math.round(tickVal));
      svg.appendChild(label);
    });

    var n = weekly.length;
    var slot = plotW / n;
    var barW = Math.min(22, slot * 0.62);

    var labelEvery = Math.max(1, Math.ceil(n / 10));

    weekly.forEach(function (w, i) {
      var cx = padL + slot * i + slot / 2;
      var h = niceMax > 0 ? (w.count / niceMax) * plotH : 0;
      var y = padT + plotH - h;

      var rect = document.createElementNS(svgNS, "rect");
      rect.setAttribute("x", cx - barW / 2);
      rect.setAttribute("y", y);
      rect.setAttribute("width", barW);
      rect.setAttribute("height", Math.max(h, w.count > 0 ? 2 : 0));
      rect.setAttribute("rx", 3);
      rect.setAttribute("class", "bar" + (colorClass ? " " + colorClass : ""));
      rect.dataset.index = i;
      svg.appendChild(rect);

      // transparent bigger hit target
      var hit = document.createElementNS(svgNS, "rect");
      hit.setAttribute("x", padL + slot * i);
      hit.setAttribute("y", padT);
      hit.setAttribute("width", slot);
      hit.setAttribute("height", plotH);
      hit.setAttribute("fill", "transparent");
      hit.style.cursor = "pointer";
      hit.dataset.index = i;
      svg.appendChild(hit);

      if (i % labelEvery === 0 || i === n - 1) {
        var xl = document.createElementNS(svgNS, "text");
        xl.setAttribute("x", cx);
        xl.setAttribute("y", H - 8);
        xl.setAttribute("text-anchor", "middle");
        xl.setAttribute("class", "axis-label");
        xl.textContent = xLabelFmt(w);
        svg.appendChild(xl);
      }
    });

    wrap.appendChild(svg);

    var tooltip = document.createElement("div");
    tooltip.className = "tooltip";
    wrap.appendChild(tooltip);

    function showTooltip(idx, evt) {
      var w = weekly[idx];
      var rects = svg.querySelectorAll('rect.bar');
      rects.forEach(function (r) { r.classList.remove("hovered"); });
      var thisBar = svg.querySelector('rect.bar[data-index="' + idx + '"]');
      if (thisBar) thisBar.classList.add("hovered");

      tooltip.innerHTML = "";
      var line1 = document.createElement("div");
      var valueSpan = document.createElement("span");
      valueSpan.className = "tt-value";
      valueSpan.textContent = fmtInt(w.count);
      line1.appendChild(valueSpan);
      var labelSpan = document.createElement("span");
      labelSpan.className = "tt-label";
      labelSpan.textContent = " " + unitLabel;
      line1.appendChild(labelSpan);
      tooltip.appendChild(line1);

      var line2 = document.createElement("div");
      line2.className = "tt-label";
      line2.textContent = opts.rangeFmt ? opts.rangeFmt(w) : (fmtDateShort(w.start) + " – " + fmtDateShort(w.end));
      tooltip.appendChild(line2);

      var wrapRect = wrap.getBoundingClientRect();
      var svgRect = svg.getBoundingClientRect();
      var scaleX = svgRect.width / W;
      var cx = padL + slot * idx + slot / 2;
      var barTop = padT + plotH - (niceMax > 0 ? (w.count / niceMax) * plotH : 0);

      tooltip.style.left = (cx * scaleX) + "px";
      tooltip.style.top = (barTop * (svgRect.height / H) - 8) + "px";
      tooltip.classList.add("visible");
    }
    function hideTooltip() {
      tooltip.classList.remove("visible");
      svg.querySelectorAll('rect.bar').forEach(function (r) { r.classList.remove("hovered"); });
    }

    svg.addEventListener("pointermove", function (evt) {
      var target = evt.target;
      if (target && target.dataset && target.dataset.index !== undefined) {
        showTooltip(parseInt(target.dataset.index, 10), evt);
      }
    });
    svg.addEventListener("pointerleave", hideTooltip);

    return wrap;
  }

  function niceCeil(v) {
    if (v <= 0) return 4;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) {
      var candidate = steps[i] * mag;
      if (candidate >= v) return candidate;
    }
    return 10 * mag;
  }

  // ---------- Per-program sparkline (weekly registrations since program opened) ----------
  function buildSparkline(weekly) {
    var box = document.createElement("div");
    if (!weekly || weekly.length === 0) {
      box.className = "spark-empty";
      box.textContent = "—";
      return box;
    }

    var svgNS = "http://www.w3.org/2000/svg";
    var W = 120, H = 26;
    var n = weekly.length;
    var slot = W / n;
    var barW = Math.max(2, Math.min(9, slot * 0.7));
    var maxVal = 0;
    weekly.forEach(function (w) { if (w.count > maxVal) maxVal = w.count; });

    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    svg.setAttribute("class", "spark-svg");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label",
      "Weekly registrations since the program opened, " + weekly.length + " week" + (weekly.length === 1 ? "" : "s") +
      ", most recent week " + weekly[weekly.length - 1].count + ".");

    weekly.forEach(function (w, i) {
      var cx = slot * i + slot / 2;
      var h = maxVal > 0 ? (w.count / maxVal) * (H - 2) : 0;
      var y = H - h;
      var rect = document.createElementNS(svgNS, "rect");
      rect.setAttribute("x", cx - barW / 2);
      rect.setAttribute("y", y);
      rect.setAttribute("width", barW);
      rect.setAttribute("height", Math.max(h, w.count > 0 ? 1.5 : 0));
      rect.setAttribute("rx", Math.min(2, barW / 2));
      rect.setAttribute("class", "spark-bar" + (i === weekly.length - 1 ? " current" : ""));

      var titleEl = document.createElementNS(svgNS, "title");
      titleEl.textContent = fmtDateShort(w.start) + " – " + fmtDateShort(w.end) + ": " + fmtInt(w.count) + " registration" + (w.count === 1 ? "" : "s");
      rect.appendChild(titleEl);

      svg.appendChild(rect);
    });

    box.appendChild(svg);

    var caption = document.createElement("div");
    caption.className = "spark-caption";
    caption.textContent = weekly.length + " wk since open";
    box.appendChild(caption);

    return box;
  }

  // ---------- Programs table ----------
  function sortPrograms(programs, key, dir) {
    var mult = dir === "asc" ? 1 : -1;
    var copy = programs.slice();
    copy.sort(function (a, b) {
      var av = a[key], bv = b[key];
      if (av === null || av === undefined) av = Infinity;
      if (bv === null || bv === undefined) bv = Infinity;
      if (typeof av === "string") {
        return av.localeCompare(bv) * mult;
      }
      return (av - bv) * mult;
    });
    return copy;
  }

  function buildTable(programs, showCenter, groupWeekly, includeEvergreen, showStatus) {
    var eligible = programs.filter(function (p) { return includeEvergreen || !p.is_evergreen; });
    var excludedCount = programs.length - eligible.length;

    var sorted = sortPrograms(eligible, state.sortKey, state.sortDir);

    var wrap = document.createElement("div");

    if (sorted.length === 0) {
      var empty = document.createElement("p");
      empty.className = "empty-note";
      empty.textContent = "No programs with a scheduled start date in this view.";
      wrap.appendChild(empty);
      return wrap;
    }

    // Week columns run newest-first, right of Registrations — same buckets as the sparkline/chart above.
    var weekIndexesDesc = [];
    for (var wi = groupWeekly.length - 1; wi >= 0; wi--) weekIndexesDesc.push(wi);

    var scroll = document.createElement("div");
    scroll.className = "table-scroll";
    var table = document.createElement("table");
    table.className = "programs";

    var cols = [
      { key: "name", label: "Program", align: "left", sticky: true },
    ];
    if (showCenter) cols.push({ key: "center", label: "Center", align: "left" });
    if (showStatus) cols.push({ key: "status", label: "Status", align: "left" });
    cols.push({ key: "weekly", label: "Weekly registrations since open", align: "left", sortable: false });
    cols.push({ key: "start", label: "Start date", align: "left" });
    cols.push({ key: "days_until_start", label: "Days until start", align: "right" });
    cols.push({ key: "total_regs", label: "Registrations", align: "right" });
    cols.push({ key: "regs_delta", label: "vs yesterday", align: "right" });

    var thead = document.createElement("thead");
    var htr = document.createElement("tr");
    cols.forEach(function (col) {
      var th = document.createElement("th");
      if (col.align === "right") th.classList.add("num-col");
      if (col.sticky) th.classList.add("sticky-col");
      if (col.sortable === false) {
        th.textContent = col.label;
        htr.appendChild(th);
        return;
      }
      var btn = document.createElement("button");
      btn.type = "button";
      var labelNode = document.createTextNode(col.label + " ");
      btn.appendChild(labelNode);
      var arrow = document.createElement("span");
      arrow.className = "sort-arrow" + (state.sortKey === col.key ? " active" : "");
      arrow.textContent = state.sortKey === col.key ? (state.sortDir === "asc" ? "▲" : "▼") : "▲▼";
      btn.appendChild(arrow);
      btn.addEventListener("click", function () {
        if (state.sortKey === col.key) {
          state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        } else {
          state.sortKey = col.key;
          state.sortDir = "asc";
        }
        render();
      });
      th.appendChild(btn);
      htr.appendChild(th);
    });
    // Week-by-week count columns, one per calendar week, newest first.
    weekIndexesDesc.forEach(function (wi, pos) {
      var wk = groupWeekly[wi];
      var th = document.createElement("th");
      th.className = "num-col week-col-head" + (pos === 0 ? " week-divider" : "");
      th.textContent = fmtDateShortYear(wk.start);
      th.title = fmtDateMid(wk.start) + " – " + fmtDateMid(wk.end);
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    sorted.forEach(function (p) {
      var tr = document.createElement("tr");

      var tdName = document.createElement("td");
      tdName.className = "sticky-col";
      var nameSpan = document.createElement("span");
      nameSpan.className = "prog-name";
      nameSpan.textContent = p.name;
      tdName.appendChild(nameSpan);
      if (p.is_new) {
        var newChip = document.createElement("span");
        newChip.className = "new-chip";
        newChip.textContent = "New";
        newChip.title = "Wasn't an open, tracked program as of yesterday's data";
        tdName.appendChild(newChip);
      }
      tr.appendChild(tdName);

      if (showCenter) {
        var tdCenter = document.createElement("td");
        tdCenter.className = "prog-center";
        tdCenter.textContent = p.center;
        tr.appendChild(tdCenter);
      }

      if (showStatus) {
        var tdStatus = document.createElement("td");
        tdStatus.textContent = p.status || "—";
        tr.appendChild(tdStatus);
      }

      var tdSpark = document.createElement("td");
      tdSpark.className = "spark-cell";
      tdSpark.appendChild(buildSparkline(p.weekly));
      tr.appendChild(tdSpark);

      var tdStart = document.createElement("td");
      tdStart.textContent = p.start ? fmtDateMid(p.start) : "—";
      tr.appendChild(tdStart);

      var tdDays = document.createElement("td");
      tdDays.className = "num-cell";
      var badge = document.createElement("span");
      badge.className = "days-badge";
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = p.days_until_start !== null ? fmtInt(p.days_until_start) : "—";
      badge.appendChild(n);
      tdDays.appendChild(badge);
      if (p.days_until_start !== null && p.days_until_start <= 7) {
        var chip = document.createElement("span");
        chip.className = "soon-chip";
        chip.textContent = "Soon";
        tdDays.appendChild(chip);
      }
      tr.appendChild(tdDays);

      var tdRegs = document.createElement("td");
      tdRegs.className = "num-cell";
      tdRegs.textContent = fmtInt(p.total_regs);
      tr.appendChild(tdRegs);

      var tdDelta = document.createElement("td");
      tdDelta.className = "num-cell";
      var deltaSpan = document.createElement("span");
      var rdir = p.regs_delta > 0 ? "up" : (p.regs_delta < 0 ? "down" : "flat");
      deltaSpan.className = "row-delta is-" + rdir;
      var rArrow = rdir === "up" ? "▲" : (rdir === "down" ? "▼" : "•");
      var rSigned = (p.regs_delta > 0 ? "+" : "") + fmtInt(p.regs_delta);
      deltaSpan.textContent = rdir === "flat" ? "•" : (rArrow + " " + rSigned);
      deltaSpan.title = (rdir === "flat" ? "No change" : rSigned) + " vs yesterday";
      tdDelta.appendChild(deltaSpan);
      tr.appendChild(tdDelta);

      // Week-by-week counts, aligned to the same columns as the header (newest first).
      // Null means the program hadn't opened yet during that week.
      weekIndexesDesc.forEach(function (wi, pos) {
        var tdWeek = document.createElement("td");
        tdWeek.className = "week-count" + (pos === 0 ? " week-divider" : "");
        var val = p.weekly_aligned ? p.weekly_aligned[wi] : null;
        if (val === null || val === undefined) {
          tdWeek.classList.add("na");
          tdWeek.textContent = "–";
        } else {
          if (val > 0) tdWeek.classList.add("has-data");
          tdWeek.textContent = fmtInt(val);
        }
        tr.appendChild(tdWeek);
      });

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    wrap.appendChild(scroll);

    var footNote = document.createElement("footer");
    footNote.className = "note";
    var footParts = [];
    if (excludedCount > 0) {
      footParts.push(excludedCount + " ongoing / self-paced program" + (excludedCount === 1 ? "" : "s") +
        " with no fixed start date " + (excludedCount === 1 ? "is" : "are") + " excluded from this list and from the totals above.");
    }
    var newCount = eligible.filter(function (p) { return p.is_new; }).length;
    if (newCount > 0) {
      footParts.push(newCount + " program" + (newCount === 1 ? "" : "s") + " marked “New” " + (newCount === 1 ? "wasn't" : "weren't") + " open and tracked as of yesterday's data.");
    }
    footParts.push("“–” in a week column means the program hadn’t opened yet that week.");
    footNote.textContent = footParts.join(" ");
    wrap.appendChild(footNote);

    return wrap;
  }

  // ---------- Weekly detail table (accessible fallback) ----------

  // ---------- Highlights (what changed since yesterday) ----------
  function buildHighlights(g, tabDef) {
    var eligible = g.programs.filter(function (p) { return !p.is_evergreen; });
    var yesterdayLabel = fmtDateShort(addDays(g.today || TODAY, -1));
    var items = [];

    if (g.total_regs_delta !== 0) {
      var totalUp = g.total_regs_delta > 0;
      items.push({
        dot: totalUp ? "is-up" : "is-down",
        build: function (row) {
          row.appendChild(document.createTextNode("Total registrations " + (totalUp ? "up " : "down ")));
          var strong = document.createElement("strong");
          strong.textContent = fmtInt(Math.abs(g.total_regs_delta));
          row.appendChild(strong);
          row.appendChild(document.createTextNode(" since " + yesterdayLabel + "."));
        }
      });
    }

    var newOnes = eligible.filter(function (p) { return p.is_new; });
    if (newOnes.length > 0) {
      items.push({
        dot: "is-new",
        build: function (row) {
          var strong = document.createElement("strong");
          strong.textContent = newOnes.length + " new program" + (newOnes.length === 1 ? "" : "s");
          row.appendChild(strong);
          var names = newOnes.slice(0, 2).map(function (p) {
            return p.name + (p.start ? " (" + fmtDateShort(p.start) + ")" : "");
          }).join(", ");
          var extra = newOnes.length > 2 ? " +" + (newOnes.length - 2) + " more" : "";
          row.appendChild(document.createTextNode(" opened: " + names + extra + "."));
        }
      });
    }

    var movers = eligible
      .filter(function (p) { return p.regs_delta > 0; })
      .sort(function (a, b) { return b.regs_delta - a.regs_delta; });
    if (movers.length > 0) {
      var top = movers[0];
      var topNameCount = eligible.filter(function (p) { return p.name === top.name; }).length;
      items.push({
        dot: "is-up",
        build: function (row) {
          var strong = document.createElement("strong");
          strong.textContent = top.name + (topNameCount > 1 && top.start ? " (" + fmtDateShort(top.start) + ")" : "");
          row.appendChild(strong);
          row.appendChild(document.createTextNode(" led with +" + fmtInt(top.regs_delta) + " registration" + (top.regs_delta === 1 ? "" : "s") + " since yesterday."));
        }
      });
    }

    var soon = eligible.filter(function (p) {
      return p.days_until_start !== null && p.days_until_start >= 0 && p.days_until_start <= 7;
    });
    if (soon.length > 0) {
      items.push({
        dot: "is-soon",
        build: function (row) {
          var strong = document.createElement("strong");
          strong.textContent = soon.length + " program" + (soon.length === 1 ? "" : "s");
          row.appendChild(strong);
          row.appendChild(document.createTextNode(" start" + (soon.length === 1 ? "s" : "") + " within 7 days."));
        }
      });
    }

    return buildHighlightsCard(
      "What changed since " + yesterdayLabel + " · " + tabDef.label,
      "No changes since " + yesterdayLabel + ".",
      items
    );
  }

  function buildHighlightsCard(subtitleText, emptyText, items) {

  function buildInsightsCard(titleText, subtitleText, insights) {

  function buildStatRow(stats) {
    var statRow = document.createElement("div");
    statRow.className = "stat-row";
    statRow.style.setProperty("--stat-cols", stats.length);
    stats.forEach(function (s) {
      var tile = document.createElement("div");

        delta.className = "stat-delta is-" + dir;
        var arrow = dir === "up" ? "▲" : (dir === "down" ? "▼" : "•");
        var signed = (s.delta > 0 ? "+" : "") + fmtInt(s.delta);
